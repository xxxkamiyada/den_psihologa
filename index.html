<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>День психолога</title>
<meta name="description" content="Учебный тренажёр: один рабочий день психолога. Три онлайн-встречи, перерывы и супервизия. Университет Современной Психологии.">
<style>
/* ===== «День психолога» — стили. Тема всегда светлая (раздел 06) ===== */
:root{
  color-scheme: light;
  --paper:#f6f1e8; --card:#fffdf8; --ink:#2c2722; --ink-soft:#5d5449; --muted:#6e6458;
  --line:#ded2c0; --line-soft:#ebe2d4;
  --accent:#6d5d87; --accent-soft:#efeaf4; --sage:#6f8467; --warm:#c08a6a;
  --self-bg:#ece7f3; --self-line:#cfc4de;
  --client-bg:#fffdf8; --sup-bg:#f1ece0;
  --ok:#4c6b47; --warn:#b5763f; --bad:#a05a4e;
  --r:14px; --shadow:0 10px 30px rgba(60,46,30,.13);
  --ff:"Georgia","Iowan Old Style",serif;
  --fs:"Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
@supports (height:100dvh){html,body{height:100dvh}}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.55 var(--fs);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--ff);font-weight:600;letter-spacing:.2px;margin:0}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--accent)}

#app{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0}
.screen.on{display:flex;flex-direction:column}

/* ---------- заставка ---------- */
#splash{position:relative;align-items:center;justify-content:center;overflow:hidden}
.splash-bg{position:absolute;inset:-40px;filter:blur(18px) saturate(.85);opacity:.9}
.splash-bg svg{width:100%;height:100%}
.splash-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,30,22,.5),rgba(38,30,22,.62))}
.splash-in{position:relative;text-align:center;color:#fff8ee;padding:40px 24px;max-width:640px}
.usp-mark{
  width:92px;height:92px;margin:0 auto 14px;border:2px solid rgba(255,248,238,.85);
  border-radius:50%;display:grid;place-items:center;font-family:var(--ff);
  font-size:26px;letter-spacing:2px;
}
.usp-sub{font-size:13px;letter-spacing:2.4px;text-transform:uppercase;opacity:.86}
#splash h1{font-size:clamp(38px,7vw,64px);margin:22px 0 10px}
.splash-tag{opacity:.9;margin-bottom:28px}
.splash-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- портреты: кроссфейд между тремя состояниями ---------- */
.portrait{display:block;width:100%;height:auto}
.portrait .pst{opacity:0;transition:opacity .5s ease}
.portrait.st-closed .pst-closed,
.portrait.st-neutral .pst-neutral,
.portrait.st-open .pst-open{opacity:1}

/* ---------- кнопки ---------- */
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:12px 22px;border-radius:999px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:hover{box-shadow:0 4px 14px rgba(60,46,30,.14);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-main:hover{background:#5d4f75}
.btn-ghost{background:transparent;border-color:rgba(255,248,238,.55);color:#fff8ee}
.btn-ghost:hover{background:rgba(255,248,238,.12)}
.btn-lite{background:transparent;border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btn-sm{padding:8px 16px;font-size:14px}

/* ---------- шкала ресурса ---------- */
#resourceBox{
  position:fixed;top:14px;right:16px;z-index:40;width:212px;
  background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;box-shadow:var(--shadow);display:none;
}
#resourceBox.on{display:block}
.res-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.res-label{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.res-num{font-family:var(--ff);font-size:22px;line-height:1}
.res-track{height:7px;border-radius:99px;background:#e7ddcd;margin:8px 0 7px;overflow:hidden}
.res-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),#8aa07f);transition:width .6s ease,background .4s ease}
.res-low .res-fill{background:linear-gradient(90deg,#c08a6a,#cf9b6f)}
.res-crit .res-fill{background:linear-gradient(90deg,#a05a4e,#bb6f5e)}
.res-cap{font-size:12.5px;color:var(--ink-soft);min-height:2.6em}

/* ---------- кабинет ---------- */
#cabinet{position:relative}
.scene-wrap{
  position:relative;flex:1;min-height:0;display:flex;
  background:linear-gradient(180deg,#eadfd1 0 65%,#bd9a70 65%,#b8956c 100%);
}
/* мобильная перекомпоновка: объекты крупными зонами в ряд */
.obj-row{display:none;gap:8px;padding:10px 12px 14px;background:var(--paper);border-top:1px solid var(--line)}
.obj-row .obj-btn{
  flex:1 1 30%;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:12px 8px;font-size:14px;cursor:pointer;min-height:56px;
}
.obj-row .obj-btn[disabled]{opacity:.5}
.scene-wrap svg{width:100%;height:100%;display:block}
#scene .evening-tint,#scene .light-shaft,#scene .lamp-glow{pointer-events:none}
#scene .obj{cursor:pointer}
#scene .obj:hover{filter:brightness(1.07) drop-shadow(0 3px 6px rgba(70,50,30,.35))}
#scene .obj.locked,#scene .obj.used{cursor:default;opacity:.62;filter:saturate(.72)}
/* кот утром ещё не гладится, но виден целиком: он подсказывает, куда смотреть */
#scene #obj-cat.locked{opacity:1;filter:none}
/* доступные объекты мягко светятся по силуэту; рисунок не меняется (ТЗ v7, 06 п.7) */
#scene .obj.avail{animation:objGlow 3s ease-in-out infinite}
#scene .obj.avail:hover{animation:none;filter:brightness(1.06) drop-shadow(0 0 3px rgba(255,214,140,1)) drop-shadow(0 0 18px rgba(245,180,80,.95))}
@keyframes objGlow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(255,214,140,.95)) drop-shadow(0 0 8px rgba(245,180,80,.55))}
  50%{filter:drop-shadow(0 0 3px rgba(255,214,140,1)) drop-shadow(0 0 16px rgba(245,180,80,.9))}
}
#scene .sky{transition:fill .8s ease}
#scene.day .sky{fill:url(#skyDay)}
#scene.evening .sky{fill:url(#skyEvening)}
#scene.evening .evening-tint{opacity:.16}
#scene.evening .light-shaft{opacity:0}
#scene.evening .lamp-glow{opacity:1}
#scene.evening .lamp-lit{opacity:1}
#scene .evening-tint,#scene .lamp-lit{transition:opacity .8s ease}
#scene.evening .evening-only{opacity:1}
#scene.evening .sky-detail{opacity:.25}
#scene.day .light-shaft{opacity:1}
#scene.morning .light-shaft{opacity:.8}
.obj-tip{
  position:fixed;z-index:30;pointer-events:none;background:rgba(44,39,34,.9);color:#fff8ee;
  padding:5px 10px;border-radius:8px;font-size:13px;opacity:0;transform:translate(-50%,-140%);
  transition:opacity .15s ease;white-space:nowrap;
}
.obj-tip.on{opacity:1}
/* реплика кота: на компьютере облачко над котом (позицию ставит catSay) */
.hint-bubble .cat-ico{display:inline-flex;width:22px;height:22px;vertical-align:-5px;margin-right:8px;color:var(--accent)}
.hint-bubble .cat-ico svg{width:22px;height:22px}
.hint-bubble.cat-say{bottom:auto;transform:translate(-50%,-100%);border-radius:16px;max-width:340px;
  text-align:left;pointer-events:none;padding:11px 16px;font-size:14.5px;line-height:1.45;z-index:5}
.hint-bubble.cat-say::after{content:"";position:absolute;left:calc(50% + var(--tail,0px));bottom:-8px;width:14px;height:14px;
  background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.hint-bubble.cat-say.cat-left{transform:translate(-100%,-50%)}
.hint-bubble.cat-say.cat-left::after{left:auto;right:-8px;top:50%;bottom:auto;transform:translateY(-50%) rotate(-45deg)}
/* свёрнутые карточки в финале */
.pcard-d summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard-d summary::-webkit-details-marker{display:none}
.pcard-d summary h4{margin:0}
.pcard-d summary::after{content:"›";font-size:20px;color:var(--muted);transition:transform .2s}
.pcard-d[open] summary::after{transform:rotate(90deg)}
.pcard-d[open] summary{margin-bottom:8px}
.hint-bubble{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:11px 20px;box-shadow:var(--shadow);font-size:15px;max-width:min(88vw,560px);text-align:center;
}
.day-mark{
  position:fixed;left:16px;top:14px;z-index:40;background:rgba(255,253,248,.9);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-soft);
}

/* ---------- оверлеи / панели ---------- */
.pane{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(40,32,24,.44);backdrop-filter:blur(2px);
  padding:24px;overflow:auto;
}
.pane.on{display:flex;align-items:flex-start;justify-content:center}
.pane.on > *{margin:auto}
.sheet{
  width:min(760px,100%);background:var(--paper);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);padding:26px 28px;
}
.sheet-wide{width:min(980px,100%)}
.sheet h2{font-size:26px;margin-bottom:10px}
.sheet .lead{color:var(--ink-soft)}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ---------- компьютер ---------- */
/* окно компьютера одной высоты на всех вкладках: прокручивается только содержимое вкладки */
.pc{width:min(980px,100%);background:#f3efe7;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;height:min(640px,calc(100vh - 48px));height:min(640px,calc(100dvh - 48px))}
.pc-bar,.pc-tabs,.pc-foot{flex:none}
.pc-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#e6ddcd;border-bottom:1px solid var(--line)}
.pc-dot{width:10px;height:10px;border-radius:50%;background:#c9bda9}
/* красный кружок закрытия — только в окне компьютера; в окне встречи кружки остаются серыми */
.pc-close{border:0;padding:0;background:#ec6a5e;cursor:pointer;position:relative;display:grid;place-items:center}
.pc-close:hover,.pc-close:focus-visible{background:#e0443e;outline:none}
.pc-close::after{content:"×";font-size:10px;line-height:1;color:rgba(80,10,5,.75);opacity:0;transition:opacity .15s}
.pc-close:hover::after,.pc-close:focus-visible::after{opacity:1}
.pc-title{font-size:13px;color:var(--ink-soft);margin-left:6px}
.pc-user{margin-left:auto;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pc-tabs{display:flex;gap:4px;padding:10px 14px 0;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-size:14.5px;color:var(--ink-soft)}
.tab:hover{background:#ece4d6}
.tab.on{background:var(--paper);border-color:var(--line);border-bottom-color:var(--paper);color:var(--ink)}
.pc-body{background:var(--paper);border-top:1px solid var(--line);padding:22px 24px;flex:1;min-height:0;overflow-y:auto}
.pc-foot{padding:14px 24px 18px;background:var(--paper);display:flex;justify-content:flex-end}

.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--card);margin-bottom:10px}
.row-main{display:flex;gap:12px;align-items:center;min-width:0}
.row .who{font-family:var(--ff);font-size:17px}
.row .meta{font-size:13.5px;color:var(--muted)}

/* правая часть строки: плашка статуса и под ней ссылка «Перечитать заметки» */
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.reread{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--accent);white-space:nowrap;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.row.off{opacity:.62}
.row .portrait{width:44px;height:44px;flex:none}
.state-pill{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.state-pill.done{background:#e7efe4;color:var(--ok)}
.state-pill.off{background:#eee7db;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px}
.pcard h4{margin:0 0 6px;font-family:var(--ff);font-size:16.5px;font-weight:600}
.pcard .fact{font-size:14px;color:var(--ink-soft)}
.pcard .ins{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--accent)}
/* итог встречи: карточка — главный блок экрана */
.card-label{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.card-label::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--accent)}
.pcard.hero{border:1px solid var(--line);border-left:4px solid var(--accent);padding:18px 20px 16px;
  box-shadow:0 6px 22px rgba(60,46,30,.10);animation:heroIn .6s ease both}
.pcard.hero h4{font-size:20px;margin-bottom:8px}
.pcard.hero .fact{font-size:15px}
.pcard.hero .ins{font-size:17px;font-family:var(--ff);margin-top:12px;padding-top:12px}
@keyframes heroIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spend{margin-top:14px;color:var(--ink-soft)}
.empty{color:var(--muted);font-size:14.5px}
.about-block{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
.about-block:last-of-type{border-bottom:0}
.small{font-size:13px;color:var(--muted)}

/* ---------- встреча: окно приложения видеовстреч ---------- */
#meeting{position:relative;background:#e6dccc}
.call-bg{position:absolute;inset:-30px;filter:blur(14px) saturate(.9)}
.call-bg svg{width:100%;height:100%}
.call-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(48,38,28,.42),rgba(48,38,28,.52))}
.call-win{
  position:relative;z-index:2;margin:24px auto 56px;width:min(1360px,calc(100% - 48px));
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--paper);border:1px solid #c9bba6;border-radius:16px;
  box-shadow:0 24px 60px rgba(40,28,16,.32);overflow:hidden;
}
.call-bar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:#e6ddcd;border-bottom:1px solid var(--line);flex:none;
}
.call-dots{display:flex;gap:6px}
.call-dots i{width:10px;height:10px;border-radius:50%;background:#c9bda9}
.call-title{font-size:13px;color:var(--ink-soft)}
.call-live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.call-live i{width:8px;height:8px;border-radius:50%;background:#a8574e;animation:live 2s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}

.call-body{flex:1;min-height:0;display:flex}
.call-left{
  flex:0 0 42%;max-width:520px;min-width:0;display:flex;flex-direction:column;gap:12px;
  padding:14px;border-right:1px solid var(--line);background:#f1ebe0;
}
.call-right{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;justify-content:flex-start}

/* видеоокно клиента */
.video{
  position:relative;flex:1 1 auto;min-height:220px;border-radius:14px;overflow:hidden;
  transition:box-shadow .3s ease;
  background:linear-gradient(180deg,#dfe6e6,#cdd7d6);
  display:flex;align-items:flex-end;justify-content:center;
}
.video-face{position:absolute;inset:0}
.video-face svg{display:block;width:100%;height:100%}
.video.speaking{box-shadow:inset 0 0 0 3px rgba(109,93,135,.45)}
.video-plate{
  position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:2px;
  background:rgba(38,32,26,.62);color:#fdf6ea;border-radius:10px;padding:6px 11px;
}
.vp-name{font-family:var(--ff);font-size:15px}
.vp-state{font-size:12px;opacity:.85}
.video-icons{position:absolute;right:10px;top:10px;display:flex;gap:6px;opacity:.8}
.video-icons span{background:rgba(38,32,26,.5);border-radius:8px;padding:5px;color:#fdf6ea;display:grid;place-items:center}
.video-icons svg{width:15px;height:15px;display:block}

/* лицо: дышит, моргает, говорит */
.vface .vst{opacity:0;transition:opacity .5s ease}
.vface.st-closed .vst-closed,
.vface.st-neutral .vst-neutral,
.vface.st-open .vst-open{opacity:1}
.vf-body{animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(12px,16px) scale(1.76)}50%{transform:translate(12px,12.4px) scale(1.772)}}
.vf-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite}
@keyframes blink{0%,95.5%,100%{transform:scaleY(1)}97%,98.4%{transform:scaleY(.12)}}
.vf-talk{opacity:0;transform-box:fill-box;transform-origin:center}
.vface.talking .vf-talk{opacity:1;animation:talk .34s ease-in-out infinite}
.vface.talking .vf-mouth{opacity:0}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

/* контакт — тонкой полосой по низу видеоокна, без цифр */
.contact-wrap{position:absolute;left:0;right:0;bottom:0}
.contact-label{
  position:absolute;right:10px;bottom:10px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:#fdf6ea;opacity:.75;text-shadow:0 1px 3px rgba(30,24,18,.5);
}
.contact-track{height:6px;background:rgba(38,32,26,.22);overflow:hidden}
.contact-fill{height:100%;width:0;background:linear-gradient(90deg,#b49ec9,var(--accent));transition:width .55s ease}

/* супервизор — отдельный участник, а не сообщение в чате */
.sup-box{
  flex:0 0 clamp(170px,38%,230px);display:flex;flex-direction:column;  /* фиксированная высота: видео над панелью не прыгает от длины заметки */
  background:var(--card);border:1px solid var(--line-soft);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:11px 13px;overflow-y:auto;
}
.sup-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sup-ava{width:40px;height:40px;flex:none;border-radius:50%;overflow:hidden;background:#e7e9e2}
.sup-ava svg{width:100%;height:auto;display:block}
.sup-name{font-family:var(--ff);font-size:15px}
.sup-role{font-size:12px;color:var(--muted)}
.sup-all{
  margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:5px 11px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
}
.sup-all:hover{background:var(--accent-soft)}
/* подсказка «Читать ›» нужна только на узком экране, где заметка обрезана до трёх строк */
.sup-open{display:none}
.sup-note{font-size:14.5px;color:var(--ink-soft);line-height:1.5}
.sup-box{transition:box-shadow .45s ease,border-color .45s ease}
.sup-box.lvl-good{box-shadow:0 0 0 3px rgba(150,186,142,.5),0 0 18px rgba(150,186,142,.35)}
.sup-box.lvl-part{box-shadow:0 0 0 3px rgba(226,197,124,.55),0 0 18px rgba(226,197,124,.35)}
.sup-box.lvl-bad{box-shadow:0 0 0 3px rgba(216,158,146,.55),0 0 18px rgba(216,158,146,.35)}
.sup-note.flash{animation:noteIn .5s ease}
@keyframes noteIn{0%{background:var(--accent-soft)}100%{background:transparent}}
.sn-title{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sn-verdict{font-family:var(--ff);color:var(--ink);margin-bottom:4px}

/* лента: растёт сверху, варианты — сразу под ней */
.feed{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 6px;scroll-behavior:smooth}
.feed-in{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:7px}
/* ход — служебная группа, на отступы не влияет: 7 px внутри одной стороны, 16 px при смене говорящего */
.turn{display:contents}
.msg:not(.self) + .msg.self,.msg.self + .msg:not(.self){margin-top:9px}

.msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.bubble{
  background:var(--client-bg);border:1px solid var(--line);border-radius:16px 16px 16px 5px;
  padding:10px 14px;max-width:min(60ch,82%);box-shadow:0 1px 2px rgba(60,46,30,.05);
}
.msg.self{justify-content:flex-end}
.msg.self .bubble{
  background:var(--self-bg);border-color:var(--self-line);border-radius:16px 16px 5px 16px;
  max-width:min(56ch,82%);
}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:#bdb0a0;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.term{
  border:0;background:none;padding:0;cursor:help;color:inherit;font:inherit;
  border-bottom:1px dashed var(--accent);
}
.term:hover{color:var(--accent)}
.termpop{
  position:fixed;z-index:70;max-width:320px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;display:none;
}
.termpop.on{display:block}
.termpop b{display:block;font-family:var(--ff);margin-bottom:4px}

/* блок выбора — отдельная зона, а не продолжение чата */
.answers.hidden{display:none}
.answers{flex:none;margin-top:auto;padding:8px 14px 14px}
.answers-in{
  max-width:668px;margin:0 auto;background:#ece5d7;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px 14px;box-shadow:0 2px 10px rgba(60,46,30,.07);
}
.answers .cue{
  display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 9px;
}
.answers .cue::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--accent);flex:none}
.waiting{font-size:14px;color:var(--muted);padding:4px 2px}
.reply-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reply-hint{font-size:13.5px;color:var(--muted)}
#reply[disabled]{background:#cfc6b8;border-color:#cfc6b8;color:#f6f1e9;cursor:default;box-shadow:none;opacity:1}
#reply.ready,#fin.ready{animation:replyReady .9s ease 1}
@keyframes replyReady{0%{box-shadow:0 0 0 0 rgba(109,93,135,.55)}100%{box-shadow:0 0 0 12px rgba(109,93,135,0)}}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;cursor:pointer;line-height:1.45;transition:border-color .14s ease,box-shadow .14s ease;
}
.opt:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(60,46,30,.12)}
.opt.locked{cursor:default;color:var(--muted);background:#f0ebe0;border-style:dashed}
.opt.locked:hover{border-color:var(--line);box-shadow:none}
.feed-cta{display:flex;justify-content:center;margin:9px 0 4px}
.m-dim{filter:saturate(.72)}

/* ---------- интерактивы ---------- */
.inter{display:grid;gap:16px}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field-label{font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.caption-box{background:var(--card);border:1px solid var(--line-soft);border-left:3px solid var(--sage);border-radius:0 12px 12px 0;padding:13px 15px;color:var(--ink-soft)}
.petting{position:relative;height:210px;background:#efe8db;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;cursor:grab;touch-action:none}
.petting svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:250px}
.purr{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:14px;color:var(--muted);opacity:0;transition:opacity .4s ease}
.purr.on{opacity:1}
.water-scene{background:#efe8db;border:1px solid var(--line-soft);border-radius:14px;padding:8px;user-select:none}
.water-scene svg{display:block;width:100%;max-height:230px;margin:0 auto}
.water-scene .can{transform-origin:110px 60px;transition:transform .35s ease}
.water-scene .can.pouring{transform:rotate(28deg)}
.water-scene .stream{opacity:0;transition:opacity .2s ease}
.water-scene .stream.on{opacity:1;animation:pour .6s linear infinite}
@keyframes pour{0%{transform:translateY(-4px)}100%{transform:translateY(4px)}}
#soil{transition:fill .3s linear}
.water-bar{height:8px;border-radius:99px;background:#e7ddcd;margin:14px 0 8px;overflow:hidden}
.water-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#9ac0d8,#7ba3c0);transition:width .12s linear}
.water-note{font-size:14px;color:var(--ink-soft);min-height:1.4em}
.water-scene .pourable{cursor:grab;touch-action:none}
.water-scene .pourable:hover{filter:brightness(1.05) drop-shadow(0 2px 4px rgba(70,50,30,.25))}
.water-scene .pourable:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.water-scene .pourable.done{cursor:default;filter:none}
.breath{display:grid;place-items:center;gap:14px;padding:12px 0}
.breath-circle{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#dfe9da,#c3d3bd);
  display:grid;place-items:center;font-family:var(--ff);font-size:17px;color:#3f4b3b;transition:transform 1s ease-in-out}
.breath-meta{font-size:14px;color:var(--muted)}
textarea{
  width:100%;min-height:78px;resize:vertical;font:15px/1.5 var(--fs);color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
}
.q-block{margin-bottom:16px}
.q-block .q{font-family:var(--ff);margin-bottom:7px}

/* ---------- супервизия и финал ---------- */
.sv-line{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.sv-line .portrait{width:44px;height:44px;flex:none}
.sv-line .bubble{max-width:62ch}
.anchor{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.anchor .recall{font-size:14px;color:var(--muted);margin-bottom:8px}
.anchor .who{font-family:var(--ff);font-size:16px;margin-bottom:4px}

#finale .sheet{max-width:860px}
.branch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0}
.branch h3{font-size:20px;margin-bottom:6px}
.pause-line{border-left:3px solid var(--warm);background:#f6ece1;border-radius:0 12px 12px 0;padding:12px 15px;color:var(--ink-soft)}
.answers-recap{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px}
.answers-recap .qa{margin-bottom:12px}
.answers-recap .qa:last-child{margin-bottom:0}
.answers-recap .q{font-size:13.5px;color:var(--muted)}
.disclaimer{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.5}

/* ---------- cookies ---------- */
.cookies{
  position:fixed;left:16px;bottom:16px;z-index:50;max-width:340px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;font-size:13.5px;
}
.cookies.off{display:none}
.cookies .sheet-actions{margin-top:10px}

/* ---------- узкий экран: видео сверху, чат и варианты под ним ---------- */
@media (max-width:900px){
  .call-win{margin:0;width:100%;border-radius:0;border:0}
  .call-bar{padding:7px 12px}
  .call-dots{display:none}
  .call-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .call-live{font-size:0;gap:0}
  .call-live i{width:9px;height:9px}
  .call-body{flex-direction:column}
  .call-left{
    flex:none;max-width:none;flex-direction:row;align-items:stretch;gap:10px;
    padding:10px;border-right:0;border-bottom:1px solid var(--line);
  }
  .video{flex:0 0 44%;min-height:0;height:134px}
  .video-plate{left:5px;bottom:6px;padding:3px 7px;border-radius:8px}
  .vp-name{font-size:12px}.vp-state{font-size:10px}
  .video-icons{display:none}
  .pc-bar{flex-wrap:wrap}
  .pc-user{flex-basis:100%;max-width:none;margin-left:0;padding-left:2px}
  .contact-label{display:none}
  .contact-track{height:5px}
  /* заметка супервизора — три строки, полностью открывается по нажатию */
  .sup-box{flex:1;max-height:none;border-radius:0 10px 10px 0;padding:8px 10px;cursor:pointer}
  .sup-head{margin-bottom:5px;gap:7px}
  .sup-ava{width:28px;height:28px}
  .sup-name{font-size:14px}.sup-role{font-size:11px}
  .sup-all{display:none}
  .sup-open{display:block;align-self:flex-end;margin-top:3px;font-size:11.5px;line-height:1.2;color:var(--accent)}
  .sup-note{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .sn-title{display:none}
  .call-right{flex:1;min-height:0;justify-content:flex-start}
  .feed{padding:12px 12px 4px}
  .answers{padding:6px 12px max(12px, env(safe-area-inset-bottom))}
  .reply-row{flex-wrap:nowrap}
  .reply-row .btn{white-space:nowrap;flex:none}
  .reply-hint{font-size:12.5px;line-height:1.3}
  .opt{padding:10px 12px;font-size:15px;line-height:1.4}
}

/* ---------- мобильный экран ---------- */
@media (max-width:760px){
  body{font-size:15.5px}
  #resourceBox{position:static;width:auto;margin:10px 12px 2px;box-shadow:none;flex:0 0 auto}
  .day-mark{display:none}
  /* сцена — полосой во всю ширину, объекты — крупными зонами под ней */
  .scene-wrap{flex:0 0 auto;height:56.25vw;background:none}
  .obj-row{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;flex:1;min-height:0;border-top:0}
  .obj-row .obj-btn{min-height:0;font-size:14.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .obj-row .obj-btn svg{width:30px;height:30px;opacity:.8}
  .obj-row .obj-btn .st{font-size:12px;color:var(--muted)}
  .hint-bubble{
    position:static;transform:none;max-width:none;border-radius:12px;
    margin:0 12px 2px;font-size:14px;padding:10px 14px;box-shadow:none;
  }
  .pane{padding:12px}
  .pc{height:calc(100vh - 24px);height:calc(100dvh - 24px)}
  .sheet{padding:20px 18px;border-radius:16px}
  .m-head{gap:10px;padding:9px 12px}
  .m-head .portrait{width:42px;height:42px}
  .m-name{font-size:17px}
  .contact-wrap{width:96px;flex:none}
  .feed{padding:16px 12px 20px}
  .bubble{max-width:86%}
  .msg.self .bubble{max-width:86%}
  .sup{width:100%}
  .opts{grid-template-columns:1fr}
  .answers{padding:12px 12px 16px}
  .cards{grid-template-columns:1fr}
  .cookies{left:10px;right:10px;bottom:10px;max-width:none}
  .breath-circle{width:160px;height:160px}
}
@media (max-width:760px) and (orientation:portrait){
  #scene{--m:1}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
  #scene .obj.avail{animation:none!important;filter:drop-shadow(0 0 3px rgba(255,214,140,1)) drop-shadow(0 0 12px rgba(245,180,80,.75))}
  .pcard.hero{animation:none!important}
}

/* шрифты Formular, Futura PT, Druk Cyr (только «УСП») встроены в файл */
@font-face{font-family:Formular;font-weight:500;src:url(fonts/formular-500.woff2) format("woff2")}@font-face{font-family:Formular;font-weight:700;src:url(fonts/formular-700.woff2) format("woff2")}@font-face{font-family:Futura;font-weight:400;src:url(fonts/futura-400.woff) format("woff")}@font-face{font-family:Futura;font-weight:600;src:url(fonts/futura-600.woff) format("woff")}@font-face{font-family:Druk;font-weight:700;src:url(fonts/druk-700.woff2) format("woff2")}
/* ===================== v23: стиль по design.md и макетам v4 =====================
   Тетрадь в интерфейсе, рисованный кабинет из слоёв. Перекрывает старые правила выше. */
:root{
  --paper:#F6EEE1; --card:#FBF6EC; --sheet:#FBF6EC; --ink:#3B2A26; --ink-soft:#5A4A43; --muted:#8A7468;
  --line:#E6D8C3; --line-soft:#EDE2D2; --accent:#3B2A26; --accent-soft:#F2D98A; --pencil:#B8322F; --usp:#CA292E;
  --blue:#2F4A7A; --marker:#F2D98A; --sage:#7D8A4E; --warm:#C08A3E;
  --good:#5E7F4A; --part:#C08A3E; --bad:#9A4A3F;
  --self-bg:#FBF6EC; --self-line:#FBF6EC; --client-bg:#FBF6EC; --sup-bg:#FBF6EC;
  --r:12px; --shadow:0 4px 0 rgba(59,42,38,.15);
  --ff:Formular,"Helvetica Neue",Arial,sans-serif; --fs:Futura,"Helvetica Neue",Arial,sans-serif;
  --top-h:72px;
}
body{background:var(--paper);font:17px/1.55 var(--fs);font-feature-settings:"cpsp" 0}
h1,h2,h3,h4{font-family:var(--ff);font-weight:500;letter-spacing:-.2px}
a{color:var(--blue)}

/* ---------- кнопки: контур и плоский край снизу ---------- */
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 20px;
  font:600 16px/1.35 var(--fs);box-shadow:0 3px 0 var(--ink);transition:background .15s ease,transform .08s ease,box-shadow .08s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--marker);transform:none;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn-main{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn-main:hover{background:#5A4038}
.btn-lite,.btn-ghost{background:var(--card);color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--marker)}
.btn[disabled],#reply[disabled]{background:var(--line)!important;border-color:var(--line)!important;color:var(--muted)!important;box-shadow:none!important;opacity:1;transform:none}
.btn-sm{padding:8px 16px;font-size:14.5px}
#reply.ready,#fin.ready{animation:none}

/* ---------- шапка: УСП, «День психолога», ресурс на бумажном ярлыке ---------- */
#topbar{display:none;flex:none;height:var(--top-h);align-items:center;gap:18px;padding:0 32px;background:var(--paper);
  border-bottom:1px solid var(--line);position:relative;z-index:30}
#topbar.on{display:flex}
#topbar .logo{font:700 44px/1 Druk,Impact,sans-serif;color:var(--usp);letter-spacing:0}
#topbar .top-title{font:500 17px/24px var(--ff)}
#topbar .top-cap{margin-left:auto;max-width:300px;text-align:right;font-size:13.5px;line-height:1.35;color:var(--muted)}
#resourceBox{position:relative;display:block;top:auto;right:auto;width:206px;flex:none;background:var(--card);border:1px solid #CDB99C;
  border-radius:3px 5px 7px 3px;padding:10px 14px 9px;transform:rotate(-1deg);box-shadow:2px 3px 0 rgba(59,42,38,.1);z-index:auto}
#resourceBox::before{content:"";position:absolute;top:-6px;left:74px;width:58px;height:14px;background:rgba(216,174,78,.36);
  border:1px solid rgba(216,174,78,.3);transform:rotate(5deg)}
.res-top{align-items:center}
.res-label{font:400 13.5px/1.3 var(--fs);letter-spacing:0;text-transform:none;color:var(--ink);border-bottom:1.5px dotted var(--pencil)!important}
.res-num{font:500 17px/1 var(--ff)}
.res-track{height:8px;margin:7px 0 2px;border:1px solid var(--muted);border-radius:40% 15% 25% 12%;background:var(--line)}
.res-fill{background:var(--sage);border-radius:20% 30% 12% 25%}
.res-low .res-fill{background:var(--part)}
.res-crit .res-fill{background:var(--bad)}
.res-cap{display:none}

/* ---------- оверлеи: окно поверх сцены с плоским краем; «страница» без затемнения ---------- */
.pane{top:var(--top-h-now,0px);background:rgba(59,42,38,.38);backdrop-filter:none;padding:24px}
.pane.page{background:var(--paper)}
.sheet{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(59,42,38,.15);padding:28px 32px}
.pane.page .sheet{border:0;box-shadow:none;background:transparent;padding:16px 8px}
.sheet h2{font-size:28px;margin-bottom:14px}
.sheet .lead{color:var(--ink)}
.field-label{font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--muted);margin-bottom:6px}
input#nm{width:100%;height:48px;font:17px var(--fs);padding:8px 12px;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;
  background:var(--paper);color:var(--blue);outline:none}
input#nm:focus{border-bottom-color:var(--pencil)}
textarea{background:var(--card);border:0;border-bottom:1.5px solid var(--ink);border-radius:0;color:var(--blue);font:16px/24px var(--fs);min-height:56px}
textarea:focus{outline:none;border-bottom-color:var(--pencil)}
.term{border-bottom:1.5px dashed var(--pencil)}
.term:hover{color:var(--pencil)}
.termpop{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 rgba(59,42,38,.15)}

/* ---------- заставка ---------- */
#splash{display:none;position:relative;overflow:hidden;align-items:stretch;justify-content:stretch}
#splash.on{display:flex}
.splash-world{position:absolute;inset:0;overflow:hidden}
.splash-card{position:relative;z-index:2;margin:56px 0 0 64px;width:540px;max-width:calc(100% - 32px);align-self:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:5px 6px 0 rgba(59,42,38,.15);padding:40px 48px}
.splash-brand{display:flex;align-items:center;gap:18px;margin-bottom:30px;font-size:13.5px;line-height:1.4;color:var(--ink)}
.splash-brand .logo{font:700 64px/1 Druk,Impact,sans-serif;color:var(--usp)}
.splash-card h1{font-size:44px;line-height:1.1;letter-spacing:-1.2px;margin:0 0 20px}
.splash-card p{margin:0 0 26px}
.splash-card .splash-actions{justify-content:flex-start}
.cookies{left:64px;right:64px;bottom:24px;max-width:none;display:flex;align-items:center;gap:24px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:none;padding:14px 22px;font-size:13.5px}
.cookies .sheet-actions{margin:0 0 0 auto}

/* ---------- кабинет: сцена из слоёв ---------- */
#cabinet{background:var(--paper)}
.scene-wrap{background:#E9CDB4;overflow:hidden;display:block;position:relative}
.scene-world{position:absolute;isolation:isolate;transform-origin:0 0}
.room-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.room-base{object-fit:fill}
.beam{opacity:.55}
.obj-glow{position:absolute;pointer-events:none;opacity:0;transition:opacity .4s ease;
  filter:drop-shadow(3px 0 0 #F2D98A) drop-shadow(-3px 0 0 #F2D98A) drop-shadow(0 3px 0 #F2D98A) drop-shadow(0 -3px 0 #F2D98A)}
.obj-glow.on{opacity:.75;animation:outline-breathe 5s ease-in-out infinite}
.cat-sprite{position:absolute;pointer-events:none;transition:filter .4s ease}
.cat-sprite img{position:absolute;inset:0;width:100%;height:100%}
.cat-sprite.glow{filter:drop-shadow(2px 0 0 #F2D98A) drop-shadow(-2px 0 0 #F2D98A) drop-shadow(0 2px 0 #F2D98A) drop-shadow(0 -2px 0 #F2D98A)}
.cat-body{transform-origin:50% 85%;animation:cat-breathe 5.8s ease-in-out infinite}
.cat-tail{transform-origin:40% 70%;animation:tail 12s ease-in-out infinite}
.cat-ear{transform-origin:80% 45%;animation:ear 19s ease-in-out infinite}
.layer-curtain-left{transform-origin:15.55% 4.63%;animation:curtain 9s ease-in-out infinite}
.layer-curtain-right{transform-origin:39.06% 7.13%;animation:curtain 11s ease-in-out -3s infinite}
.layer-plant-leaves{transform-origin:54.06% 48.25%;animation:leaves 8s ease-in-out infinite}
.layer-clock-hour{transform-origin:64.0625% 17.625%;animation:clock 43200s linear infinite}
.layer-clock-minute{transform-origin:64.0625% 17.625%;animation:clock 3600s linear infinite}
.layer-cloud-1{animation:cloud 45s ease-in-out infinite}.layer-cloud-2{animation:cloud 57s ease-in-out -10s infinite}.layer-cloud-3{animation:cloud 68s ease-in-out -22s infinite}
.steam{opacity:0;animation:steam 6s linear infinite}.steam-1{animation-delay:2s}.steam-2{animation-delay:4s}
.dust{animation:dust 19s ease-in-out infinite}
.lamp{opacity:.45}
.world-hit{position:absolute;padding:0;border:0;background:none;cursor:pointer;z-index:6}
.world-hit.locked{cursor:default}
.world-hit:focus-visible{outline:2px dashed var(--marker);outline-offset:4px}
.paper-tag{position:absolute;left:50%;bottom:96%;white-space:nowrap;font:600 14px/20px var(--fs);color:var(--ink);background:var(--card);
  border:1.5px solid var(--ink);border-radius:2px 5px 4px 2px;padding:6px 12px;opacity:0;pointer-events:none;translate:-50% 0;
  transform-origin:50% -8px;box-shadow:2px 2px 0 rgba(59,42,38,.15);transition:opacity .15s ease}
.paper-tag::before{content:"";position:absolute;left:50%;top:-9px;height:10px;width:1px;background:var(--ink)}
.world-hit:not(.locked):hover .paper-tag,.world-hit:not(.locked):focus-visible .paper-tag{opacity:1;animation:tag 4s ease-in-out infinite}
.hit-cat .paper-tag{bottom:auto;top:100%;margin-top:12px}
/* облачко кота: рисованный контур, выпрыгивает и чуть покачивается */
#cabHint{position:absolute;z-index:8;left:0;top:0;bottom:auto;transform:none;width:300px;max-width:none;text-align:left;
  background:var(--card);border:2px solid var(--ink);border-radius:38% 25% 32% 19% / 18% 25% 22% 29%;box-shadow:none;
  padding:16px 22px;font-size:16px;line-height:24px;pointer-events:none;transform-origin:var(--tail-x,60%) 100%;
  animation:bubble-enter .45s ease-out,bubble-sway 9s ease-in-out .45s infinite}
#cabHint::after{content:"";position:absolute;bottom:-14px;left:var(--tail-x,60%);width:22px;height:22px;background:var(--card);
  border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) skew(-18deg) rotate(38deg)}
#cabHint .cat-ico{display:none}
#cabHint.below::after{bottom:auto;top:-14px;transform:translateX(-50%) skew(-18deg) rotate(218deg)}

/* ---------- компьютер: монитор с окном программы ---------- */
.pc{position:relative;width:min(1120px,100%);height:min(664px,calc(100vh - var(--top-h) - 48px));height:min(664px,calc(100dvh - var(--top-h) - 48px));
  background:var(--ink);border:0;border-radius:22px;padding:24px 24px 30px;box-shadow:0 5px 0 #8A5A44;animation:window-enter .32s ease-out;overflow:visible}
.pc::after{content:"";position:absolute;left:25px;top:24px;width:180px;height:110px;background:var(--card);opacity:.08;
  clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none;z-index:6}
.pc::before{content:"";position:absolute;left:50%;bottom:11px;width:8px;height:8px;border-radius:50%;background:#8A7468;transform:translateX(-50%)}
.pc-screen{height:100%;display:flex;flex-direction:column;background:var(--card);overflow:hidden}
.pc-bar{background:var(--line);border-bottom:1px solid #CDB99C;padding:0 14px;height:30px;gap:8px}
.pc-dot{width:11px;height:11px;border:1px solid var(--muted);background:#D8AE4E}
.pc-dot.pc-close{background:var(--pencil)}
.pc-bar .pc-dot:nth-child(3){background:var(--sage)}
.pc-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px 6px}
.pc-head h2{font-size:28px;margin:0}
.pc-tabs{gap:4px;padding:0 28px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 18px;font:400 16px var(--fs);color:var(--ink);background:none}
.tab:hover{background:none;color:var(--ink)}
.tab.on{border:0;border-bottom:3px solid var(--pencil);font-weight:600;background:none}
.pc-body{background:var(--card);border:0;padding:18px 28px}
.pc-body h3{font-size:20px}
.pc-dock{flex:none;height:30px;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--line);font-size:13.5px}
.pc-dock svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6}
.pc-dock time{margin-left:auto}
.row{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:12px 0}
.row .portrait,.row .pimg{width:60px;height:60px;border:1.5px solid var(--ink);border-radius:12px;object-fit:cover;background:#E9CDB4}
.row .who{font:500 20px/1.25 var(--ff)}
.row .meta{font-size:13.5px}
.row.off{opacity:1}
.row.off .who{color:var(--ink)}
.state-pill{border-radius:6px;padding:6px 16px;font-size:13.5px;background:var(--line);color:var(--muted)}
.state-pill.done{background:#E4EBDD;color:var(--good)}
.reread{color:var(--blue)}
.pcard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--pencil);border-radius:4px 4px 12px 12px;padding:16px 20px}
.pcard h4{font:500 18px/1.3 var(--ff);margin-bottom:10px}
.pcard .fact{font-size:15.5px;line-height:24px;color:var(--ink)}
.pcard .ins{border-top:0;color:var(--blue);font:400 16px/24px var(--fs);margin-top:12px;padding-top:0}
.about-block{border-color:var(--line)}

/* ---------- встреча ---------- */
#meeting{background:var(--paper)}
.call-bg,.call-veil,.call-bar{display:none}
.call-win{margin:0;width:100%;max-width:none;border:0;border-radius:0;box-shadow:none;background:var(--paper)}
.call-body{padding:16px 32px 20px;gap:24px}
.call-left{flex:0 0 400px;max-width:400px;padding:0;border:0;background:none;gap:10px;overflow:auto}
.video{flex:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:0;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:none}
.video.speaking{box-shadow:none}
.video-face{position:relative;inset:auto;height:clamp(180px,34vh,270px);background:#E9CDB4;border-bottom:1px solid var(--line)}
.video-face svg{width:100%;height:100%;display:block}
.video-icons{display:none}
.video-info{padding:10px 16px 12px}
.video-plate{position:static;background:none;color:var(--ink);padding:0;border-radius:0;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}
.vp-name{font:500 20px/1.3 var(--ff)}
.vp-state{font-size:13.5px;line-height:18px;padding:3px 9px;background:var(--line);border-radius:4px;opacity:1;color:var(--ink)}
.contact-wrap{position:static;display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.contact-label{position:static;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--muted);opacity:1;text-shadow:none}
.contact-track{flex:1;height:6px;border-radius:2px;background:var(--line)}
.contact-fill{background:var(--sage)}
.sup-box{flex:none;background:none;border:0;border-radius:0;padding:0;overflow:visible;box-shadow:none!important}
.sup-head{margin-bottom:8px}
.sup-ava{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--ink);background:#E9CDB4}
.sup-ava svg{width:100%;height:100%}
.sup-name{font:500 16px/1.3 var(--ff)}
.sup-role{font-size:13.5px}
.sup-all{border:1.5px solid var(--ink);border-radius:8px;color:var(--ink);background:var(--card);font-size:13px}
.sup-note{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px 30px;color:var(--ink);font-size:16px;line-height:24px}
.sup-note::before{content:"";position:absolute;top:0;bottom:0;left:16px;border-left:1px solid #E3A9A0}
.sn-title{font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--muted);margin-bottom:2px}
.sn-verdict{font:500 17px/24px var(--ff);color:var(--ink);margin-bottom:6px}
.lvl-good .sn-verdict{color:var(--good)}.lvl-part .sn-verdict{color:var(--part)}.lvl-bad .sn-verdict{color:var(--bad)}
.sup-note.flash{animation:noteIn .6s ease}
@keyframes noteIn{0%{background:var(--marker)}100%{background:var(--card)}}
.call-right{gap:12px}
.feed{padding:0 4px 4px}
.feed-in{max-width:none;gap:8px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;box-shadow:none;padding:11px 16px;line-height:24px;max-width:min(64ch,88%)}
.msg.self .bubble{background:var(--card);border:0;border-radius:12px 4px 12px 12px;color:var(--blue)}
.answers{padding:0}
.answers-in{max-width:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:none;padding:16px 20px}
.answers .cue{font-size:13.5px;letter-spacing:.06em;color:var(--muted)}
.answers .cue::before{display:none}
.opt{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:10px 16px;line-height:1.45;font-size:16px}
.opt:hover{background:var(--marker);border-color:var(--ink);box-shadow:none}
.opt.locked{border-style:dashed;border-color:var(--muted);background:var(--card)}
.reply-hint{color:var(--muted)}
/* портрет: показан ровно один вариант глаз, бровей и рта; фигура дышит */
.person .g-eyes-open,.person .g-eyes-closed,.person .g-eyes-down,.person .g-brows-calm,.person .g-brows-sad,.person .g-brows-up,
.person .g-mouth-closed,.person .g-mouth-half,.person .g-mouth-open,.person .g-mouth-smile{display:none}
.person.e-open .g-eyes-open,.person.e-closed .g-eyes-closed,.person.e-down .g-eyes-down,
.person.b-calm .g-brows-calm,.person.b-sad .g-brows-sad,.person.b-up .g-brows-up,
.person.m-closed .g-mouth-closed,.person.m-half .g-mouth-half,.person.m-open .g-mouth-open,.person.m-smile .g-mouth-smile{display:inline}
.vface .fig{transform-box:view-box;transform-origin:320px 640px;animation:person-breathe 4.8s ease-in-out infinite}
.vface.nod .fig{animation:person-nod 1.1s ease-in-out 1,person-breathe 4.8s ease-in-out infinite}

/* ---------- итог встречи, супервизия, финал: страница под шапкой ---------- */
.result-page{display:grid;grid-template-columns:280px minmax(0,600px);gap:56px;align-items:start;justify-content:center;max-width:960px;margin:24px auto}
.result-art{padding-top:48px;text-align:center}
.result-art svg,.result-art img{width:240px;height:280px;border:2px solid var(--ink);border-radius:120px 120px 16px 16px;background:#E9CDB4;display:block;margin:0 auto}
.result-art p{margin-top:14px;color:var(--muted)}
.card-label{font-size:13.5px;letter-spacing:.06em;color:var(--muted);margin:24px 0 10px}
.card-label::before{display:none}
.pcard.hero{border:1px solid var(--line);border-top:3px solid var(--pencil);border-radius:4px 4px 12px 12px;box-shadow:none;padding:22px 26px}
.pcard.hero h4{font-size:20px;margin-bottom:14px}
.pcard.hero .fact{font-size:16.5px}
.pcard.hero .ins{font:400 17px/24px var(--fs);color:var(--blue);margin-top:14px;padding:0}
.spend{font-size:13.5px;color:var(--muted)}
.sv-page{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;max-width:1080px;margin:8px auto}
.sv-side .sv-photo{width:240px;height:210px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#E9CDB4;margin:14px 0 16px}
.sv-side .sv-photo svg{width:100%;height:100%;display:block}
.sv-side h3{font-size:20px;margin:0}
.sv-side .sup-role{margin-bottom:18px}
.sv-side p{line-height:26px}
.sv-main{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 32px}
.sv-main h3{font-size:18px;margin:20px 0 12px}
.sv-main h3:first-child{margin-top:0}
.anchor{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.anchor .who{font:500 17px/1.3 var(--ff)}
.anchor .recall{color:var(--muted);font-size:14.5px}
.q-block .q{font:400 16px/24px var(--fs);margin-bottom:4px}
.sv-line .bubble{background:var(--card)}
.sv-line .pimg{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:10px;background:#E9CDB4;flex:none}
.final-page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;max-width:1150px;margin:16px auto}
.final-page h2{font-size:44px;line-height:1.1;letter-spacing:-1.2px;margin-bottom:24px}
.branch{background:none;border:0;padding:0;margin:0 0 14px}
.branch h3{font-size:18px;font-weight:700;margin-bottom:8px}
.pause-line{border:0;background:none;padding:0;color:var(--ink);border-radius:0}
.final-portfolio{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 28px;align-self:start}
.final-portfolio h3{font-size:26px;margin-bottom:4px}
.final-portfolio .cards{grid-template-columns:1fr;gap:10px}
.pcard-d{padding:12px 16px}
.pcard-d summary::after{content:"›";font-size:22px;color:var(--ink)}
.pcard-d summary h4{margin:0;font-size:17px}
.answers-recap{background:var(--card);border:1px solid var(--line);border-radius:12px}
.disclaimer{border-top:1px solid var(--line);padding-top:16px;margin-top:28px}

/* ---------- паузы ---------- */
.chip{border:1.5px solid var(--ink);border-radius:10px;background:var(--card);padding:9px 16px;font:400 16px var(--fs)}
.chip:hover{background:#F7EBC4}
.chip.on{background:var(--marker);color:var(--ink);border-color:var(--ink)}
.drink-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center}
.drink-art{position:relative;width:240px;height:218px}
.drink-art img{position:absolute;inset:0;width:100%;height:100%}
.drink-art .drink-steam{animation:steam 6s linear infinite}
.caption-box{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:0 10px 10px 0;color:var(--ink)}
.petting{background:#E9CDB4;border:1.5px solid var(--ink);border-radius:12px}
.petting img{position:absolute;left:50%;top:50%;width:300px;transform:translate(-50%,-50%);pointer-events:none}
.water-scene{background:#E9CDB4;border:1.5px solid var(--ink);border-radius:12px}
.water-bar{background:var(--line)}
.water-bar i{background:#7BA3C0}
.breath-circle{background:#E4EBDD;border:2px solid var(--ink);color:var(--ink)}

@keyframes curtain{0%,100%{transform:skewX(-.25deg)}50%{transform:skewX(.35deg)}}
@keyframes leaves{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
@keyframes clock{to{transform:rotate(360deg)}}
@keyframes cloud{50%{transform:translateX(5px)}}
@keyframes cat-breathe{50%{transform:scaleY(1.03)}}
@keyframes tail{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
@keyframes ear{0%,94%,100%{transform:rotate(0)}96%{transform:rotate(-6deg)}98%{transform:rotate(3deg)}}
@keyframes steam{0%,100%{opacity:0;transform:translateY(1px)}30%{opacity:.7}70%{opacity:.25;transform:translateY(-6px)}}
@keyframes dust{50%{transform:translate(3px,-4px);opacity:.6}}
@keyframes outline-breathe{50%{opacity:.4}}
@keyframes bubble-enter{0%{opacity:0;scale:.9}75%{opacity:1;scale:1.03}100%{scale:1}}
@keyframes bubble-sway{50%{rotate:.5deg}}
@keyframes tag{50%{rotate:2deg}}
@keyframes window-enter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes person-breathe{50%{transform:translateY(-3px) scaleY(1.008)}}
@keyframes person-nod{0%,100%{transform:none}35%{transform:rotate(1.4deg) translateY(2px)}70%{transform:rotate(-.6deg)}}

/* ---------- узкий экран ---------- */

}

  #topbar .top-title{font-size:13.5px;line-height:18px;max-width:110px}
  #topbar .top-cap{display:none}

  #cabHint .cat-ico svg{width:34px;height:34px}
  .obj-row{gap:10px;padding:10px 16px 16px;background:var(--paper)}
  .obj-row .obj-btn{border:1.5px solid var(--ink);border-radius:10px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-weight:600}

  .ck-on .splash-card{margin-bottom:178px}
  .splash-card{padding:22px 22px 24px}
  .splash-card p{font-size:15.5px;line-height:23px;margin-bottom:18px}
}
@media (max-width:760px){ #cabHint{position:relative;left:auto;top:auto} }
@media (max-width:900px){
  .sup-note .sn-title{display:block;font-size:12.5px;line-height:18px}
  .sup-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 0 8px}

@media (max-width:760px){
  .tab{padding:10px 6px;font-size:13px;white-space:nowrap}

}

@media (max-width:900px){ .contact-track{flex:none;width:100%} }

/* ---------- кабинет: свечение заметнее, на бирке — что даст предмет ---------- */
.obj-glow{filter:drop-shadow(4px 0 0 #FFE39A) drop-shadow(-4px 0 0 #FFE39A) drop-shadow(0 4px 0 #FFE39A) drop-shadow(0 -4px 0 #FFE39A)
  drop-shadow(5px 0 0 rgba(255,236,170,.55)) drop-shadow(-5px 0 0 rgba(255,236,170,.55)) drop-shadow(0 5px 0 rgba(255,236,170,.55)) drop-shadow(0 -5px 0 rgba(255,236,170,.55))}

  drop-shadow(4px 0 0 rgba(255,236,170,.55)) drop-shadow(-4px 0 0 rgba(255,236,170,.55)) drop-shadow(0 4px 0 rgba(255,236,170,.55)) drop-shadow(0 -4px 0 rgba(255,236,170,.55));
  animation:glow-pulse-cat 3s ease-in-out infinite}
@keyframes glow-pulse-cat{50%{filter:drop-shadow(2px 0 0 #FFE39A) drop-shadow(-2px 0 0 #FFE39A) drop-shadow(0 2px 0 #FFE39A) drop-shadow(0 -2px 0 #FFE39A)}}
.paper-tag b{display:block;font-weight:600}

/* ---------- больше движения, ухо кота не отрывается ---------- */

@keyframes tail{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(1.5deg)}95%{transform:rotate(-1deg)}}

/* ---------- дыхание: круг растёт со вдохом ровно столько, сколько длится вдох ---------- */

.person .fig{transform-box:view-box;transform-origin:640px 1280px;animation:p-breathe 3.8s ease-in-out infinite,p-sway 11s ease-in-out infinite}

@keyframes p-breathe{0%,100%{translate:0 0;scale:1 1}50%{translate:0 -9px;scale:1.006 1.012}}
@keyframes p-sway{0%,100%{rotate:0deg}30%{rotate:.5deg}70%{rotate:-.4deg}}
@keyframes person-nod2{0%,100%{transform:none}35%{transform:rotate(1.6deg) translateY(10px)}70%{transform:rotate(-.6deg)}}
.pstack{position:relative;display:block;overflow:hidden}
.pstack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
/* кот освещён так же, как комната */
.t-afternoon .cat-sprite{filter:sepia(.18) saturate(1.08) brightness(.98)}
.t-evening .cat-sprite{filter:brightness(.74) saturate(.85) sepia(.12)}
@media (prefers-reduced-motion:reduce){ .person .fig{animation:none} }


/* ===================== v38: дыхание спокойнее ===================== */
.person .fig{animation:p-breathe2 4.8s ease-in-out infinite,p-sway2 14s ease-in-out infinite}
.vface.nod .fig{animation:person-nod3 1.4s ease-in-out 1,p-breathe2 4.8s ease-in-out infinite}
@keyframes p-breathe2{0%,100%{translate:0 0;scale:1 1}50%{translate:0 -4px;scale:1.002 1.005}}
@keyframes p-sway2{0%,100%{rotate:0deg}40%{rotate:.18deg}75%{rotate:-.14deg}}
@keyframes person-nod3{0%,100%{transform:none}40%{transform:rotate(.7deg) translateY(5px)}75%{transform:rotate(-.2deg)}}


/* ===================== v40: эмоции ===================== */
/* вставка эмоции видна только при своём классе x-*; поверх неё остаются моргание, взгляд вниз и рот в разговоре */
.person [class^="g-x-"]{display:none}
.person.x-think .g-x-think,.person.x-hurt .g-x-hurt,.person.x-touched .g-x-touched,.person.x-laugh .g-x-laugh,
.person.x-surprise .g-x-surprise,.person.x-tense .g-x-tense,.person.x-anxious .g-x-anxious,.person.x-teary .g-x-teary,
.person.x-warm .g-x-warm{display:inline}
.person:not(.x-none) .g-eyes-open,.person:not(.x-none) [class^="g-brows-"],
.person:not(.x-none) .g-mouth-closed,.person:not(.x-none) .g-mouth-smile{display:none!important}


/* ===================== v41 ===================== */
/* моргание и взгляд вниз — плавной сменой кадра, а не мгновенной подменой */
.person .g-eyes-closed,.person .g-eyes-down{display:inline!important;opacity:0;transition:opacity .14s ease-out}
.person.e-closed .g-eyes-closed{opacity:1;transition:opacity .07s ease-in}
.person.e-down .g-eyes-down{opacity:1;transition:opacity .3s ease}
/* кнопка «Пропустить» справа в строке ответа */
.skip-btn{margin-left:auto;background:none;border:0;padding:8px 4px;font:600 14px/20px var(--fs);color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.skip-btn:hover{color:var(--ink);text-decoration-color:currentColor}
.skip-btn[hidden]{display:none}
/* финал: левая колонка остаётся на месте, пока листаются карточки */
.final-page > div:first-child{position:sticky;top:8px;align-self:start}
@media (max-width:900px){ .final-page > div:first-child{position:static} }
/* без «резинки» у края прокрутки (Mac, iPhone): окно не дёргается в самом конце */
html,body,.pane,.pc-body,.pc-page,.feed{overscroll-behavior:none}
/* компьютер до первой встречи: жёлтая бирка «начните здесь» и мягкая пульсирующая рамка */
.world-hit.call .paper-tag{background:var(--marker);opacity:1!important}
.world-hit.call::after{content:"";position:absolute;inset:-4%;border:3px solid var(--marker);border-radius:12px;pointer-events:none;animation:call-pulse 2s ease-in-out infinite}
@keyframes call-pulse{0%,100%{opacity:.25;scale:1}50%{opacity:1;scale:1.03}}
@media (prefers-reduced-motion:reduce){ .world-hit.call::after{animation:none;opacity:.8} }


/* ===================== v42 ===================== */
/* браузер не подкручивает прокрутку сам, когда карточка меняет высоту */
.pane,.pane *{overflow-anchor:none}
.final-portfolio summary{-webkit-tap-highlight-color:transparent}


/* ===================== v43 ===================== */
/* веки закрываются быстро и открываются чуть медленнее; вставка теперь только веки, без бровей и кожи */
.person .g-eyes-closed{transition:opacity .09s ease-out}
.person.e-closed .g-eyes-closed{transition:opacity .04s linear}
.person .g-eyes-closed,.person .g-eyes-down{will-change:opacity}


/* ===================== v44: кабинет v12 ===================== */
.scene-world .cat-sprite{filter:none!important;pointer-events:none}
.scene-world .cat-sprite::before{display:none}
.scene-world .cat-sprite img{position:absolute;inset:0;width:100%;height:100%}
/* кот на подоконнике моргает раз в несколько секунд */
.cat-blink{position:absolute;pointer-events:none;opacity:0;animation:cat-blink12 7.3s linear infinite}
@keyframes cat-blink12{0%,90.5%,93.5%,100%{opacity:0}91%,93%{opacity:1}}
/* экран монитора: светлое окно расписания, вечером светится в полутёмной комнате */
.mon-screen{position:absolute;background:#F6EFE3;border-radius:2px;overflow:hidden;pointer-events:none;
  box-shadow:0 0 0 1px rgba(43,37,34,.4) inset;animation:mon-on 5s ease-in-out infinite}
.mon-screen.night{background:#FBF4E7;box-shadow:0 0 18px 4px rgba(255,236,200,.35),0 0 0 1px rgba(43,37,34,.4) inset}
.ms-in{position:absolute;inset:4% 6% 7%;display:grid;grid-template-rows:13% repeat(4,1fr);row-gap:5%}
.mon-screen i{display:flex;align-items:center;gap:5%;font-style:normal;min-height:0}
.mon-screen b{display:block}
.ms-bar{border-bottom:1px solid #E3D5C1}
.ms-bar b{height:45%;aspect-ratio:1;border-radius:50%;background:#D9C6AE}
.ms-ava{height:78%;aspect-ratio:1;border-radius:50%;background:#E2B596;flex:none}
.ms-row:nth-child(3) .ms-ava{background:#9FB0C4}.ms-row:nth-child(4) .ms-ava{background:#B9A1C6}.ms-row:nth-child(5) .ms-ava{background:#C9C2B6}
.ms-line{flex:1;height:28%;border-radius:2px;background:#E2D4C1}
.ms-btn{width:20%;height:62%;border-radius:2px;background:#3B2A26;flex:none}
@keyframes mon-on{50%{filter:brightness(1.03)}}
/* пар над кружкой: три тонкие струйки поднимаются и тают */
.steam12{position:absolute;width:2.4%;height:5%;translate:-50% -100%;pointer-events:none}
.steam12 i{position:absolute;bottom:0;left:calc(20% + var(--i) * 25%);width:18%;height:100%;border-radius:50%;
  border-left:2px solid rgba(255,255,255,.75);filter:blur(.4px);opacity:0;animation:steam12 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * 1.1s)}
@keyframes steam12{0%{opacity:0;transform:translateY(20%) scaleY(.6)}35%{opacity:.8}100%{opacity:0;transform:translateY(-35%) scaleY(1.1) skewX(-8deg)}}
.t-evening .steam12 i{border-color:rgba(255,240,215,.55)}
@media (prefers-reduced-motion:reduce){ .steam12,.cat-blink{display:none} }
/* компьютер: бирка над монитором */
.world-hit[data-obj=computer] .paper-tag.pin.up{translate:-50% calc(-100% - 14px)}
.world-hit.call::after{inset:-6% -4%}
/* подсказка кабинета — записка, приклеенная в углу сцены, без хвостика */
#cabHint.note{left:calc(50% - 150px);top:22px;width:300px;border-radius:3px 6px 4px 3px;border-width:1.5px;rotate:-1.2deg;transform-origin:50% 0;
  animation:bubble-enter .45s ease-out;box-shadow:3px 4px 0 rgba(59,42,38,.12)}
#cabHint.note::after{display:none}
#cabHint.note::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:18px;translate:-50% 0;rotate:2deg;background:rgba(242,217,138,.85)}
@media (max-width:760px){
  #cabHint.note{left:auto;top:auto;width:auto;rotate:none;border-radius:12px}
  #cabHint.note::before{display:none}
}
/* полив v12: холст 680×420, лейка наклоняется на 28° вокруг точки 200,155 */
.water-art{max-width:520px;aspect-ratio:680/420}
.water-art .can{transform-origin:29.41% 36.9%}
.water-art .stream,.water-art .pot-wet{pointer-events:none}  /* струя лежит поверх лейки, но нажимают лейку */


/* ===================== v45 ===================== */
#cabHint.note{font-size:15px;line-height:22px;padding:14px 20px}


/* v47: заметка супервизора одним шрифтом и цветом; удачность ответа — точкой, а не цветом текста */
.sn-short{display:flex;align-items:center;gap:8px;font:600 16px/22px var(--fs);color:var(--ink);margin-bottom:6px}
.sn-dot{flex:none;width:8px;height:8px;border-radius:50%}
.sn-dot.good{background:var(--good)}.sn-dot.part{background:var(--part)}.sn-dot.bad{background:var(--bad)}
.sup-note .sn-verdict{display:none}
.sup-note .sn-title{font:400 12.5px/18px var(--fs);color:var(--muted);margin-bottom:2px}
.sup-note::before{display:none}
.sup-note{padding:12px 16px 14px}
/* ===================== v47: телефон, заметка в карточке клиента ===================== */
@media (max-width:900px){
  .video{height:auto;min-height:132px}
  .video-face{align-self:stretch}
  .video-info{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;min-width:0}
  .video-info .sup-box{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 0 0;margin:2px 0 0;box-shadow:none!important}
  .video-info .sup-note{padding:0;margin:0;border:0;background:none!important;animation:none!important}
  .video-info .sup-note .sn-title,.video-info .sup-note .sn-verdict,.video-info .sup-note .sn-text{display:none}
  .video-info .sup-note::after{content:"заметка супервизора";display:block;order:-1;font:400 12px/16px var(--fs);color:var(--muted)}
  .video-info .sup-note{display:flex;flex-direction:column;gap:2px}
  .video-info .sn-short{display:flex;align-items:center;gap:7px;font:600 14px/19px var(--fs);color:var(--ink)}
  .video-info .sn-dot{flex:none;width:8px;height:8px;border-radius:50%}
  .sn-dot.good{background:var(--good)}.sn-dot.part{background:var(--part)}.sn-dot.bad{background:var(--bad)}
  .video-info .sup-box .sup-open{margin:4px 0 0;font:400 12.5px/18px var(--fs);color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
  .video-info .sup-note,.video-info .sup-note *{white-space:normal;overflow-wrap:anywhere}
  .video-info .sup-box,.video-info .sup-note{min-width:0;max-width:100%}
}
@media (max-width:380px){
  .video-face{width:112px}
  .video-info{padding:8px 10px 10px}
  .vp-name{font-size:17px}
}


/* ===================== v48: кнопка музыки ===================== */
.music-btn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:1.5px solid #CDB99C;border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.music-btn svg{width:20px;height:20px}
.music-btn .mb-off{display:none}
.music-btn.off{color:var(--muted)}
.music-btn.off .mb-off{display:inline}
.music-btn:hover{border-color:var(--ink)}
#topbar.no-res .music-btn{margin-left:auto}
@media (max-width:900px){ .music-btn{width:34px;height:34px} #topbar .music-btn{order:3} #resourceBox{order:2} }


/* ===================== v49: панель музыки ===================== */
#topbar{position:relative}
.music-pop{position:absolute;top:calc(100% + 8px);right:32px;z-index:60;width:260px;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;
  padding:12px 14px 14px;box-shadow:0 4px 0 rgba(59,42,38,.15)}
@media (min-width:901px){ .music-pop{right:calc(32px + 206px + 18px)} }
.music-pop[hidden]{display:none}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mp-head b{font:600 15px/20px var(--fs);color:var(--ink)}
.mp-toggle{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:4px 10px;font:600 13px/18px var(--fs);color:var(--ink);cursor:pointer}
.mp-vol{display:flex;align-items:center;gap:8px;font:400 12.5px/16px var(--fs);color:var(--muted)}
.mp-vol input{flex:1;accent-color:var(--ink);min-width:0}
@media (max-width:900px){ .music-pop{right:16px;width:min(260px,calc(100vw - 32px))} }

</style>
</head>

<div id="app">
  <header id="topbar">
    <a class="logo" href="https://umpedu.ru/" target="_blank" rel="noopener" aria-label="Университет Современной Психологии, сайт">УСП</a><span class="top-title">День психолога</span>

<script>
/* ===== «День психолога» — контент. ТЗ v19, тексты по content.md (2026-10-10, сборка v17) =====

   Типы ловушек: recipe | label | comfort | argue | offtopic | blame | lecture
   Термины в разборах: [[ключ|видимый текст]] или [[ключ]]
*/
const CONTENT = {

/* словарь терминов: в заметках [[ключ]] или [[ключ|подпись]], определение по нажатию */
glossary: {
 "исследование": "Вопрос или реплика, которая расширяет рассказ клиента и не закрывает тему. Она возвращает разговору конкретику: людей, время, место, ощущения в теле.",
 "присоединение": "Способ показать клиенту, что вы рядом и понимаете, что с ним происходит прямо сейчас. Ещё до того, как что-то интерпретировать или предлагать.",
 "валидация": "Признание чувства клиента уместным и понятным. Нужна почти всегда, но сама по себе движения не даёт: после неё разговор должен куда-то идти.",
 "интерпретация": "Версия специалиста о том, как связаны разные части рассказа. Сказанная слишком рано, она звучит как приговор.",
 "отражение": "Возврат клиенту его собственных слов или состояния, почти дословно. Человек слышит себя со стороны и часто впервые замечает, что именно сказал.",
 "контейнирование": "Способность помогающего выдержать чувство клиента, не пугаясь и не торопясь его убрать. Рядом с таким человеком чувство становится переносимым.",
 "нормализация": "Сообщение о том, что реакция клиента понятна и встречается у многих. Уместна, когда снимает стыд, и вредна, когда обесценивает частный случай.",
 "психообразование": "Объяснение клиенту, как устроено то, с чем он столкнулся. Работает, когда на него есть запрос, и не работает вместо контакта.",
 "интервенция": "Любое осознанное действие специалиста в разговоре: вопрос, отражение, молчание. Её ценность видна по тому, что она сделала с контактом.",
 "альянс": "Рабочий союз клиента и специалиста: ощущение, что вы вместе занимаетесь чем-то общим. Самый надёжный предсказатель того, что работа вообще пойдёт.",
 "сопротивление": "Всё, чем клиент бережёт себя от слишком быстрого сближения: молчание, «не знаю», уход в детали. С этим материалом и работают.",
 "катастрофизация": "Привычка достраивать от небольшого события худший возможный финал. Переубеждать её аргументами бесполезно, логика до неё не достаёт.",
 "обесценивание": "Уменьшение значимости того, что человек принёс: «ерунда», «у всех так», «не переживайте». Часто делается из добрых побуждений и почти всегда закрывает тему.",
 "ярлык": "Название состояния, выданное вместо разговора о нём. Специалисту становится спокойнее, клиент остаётся один на один с чувством, у которого теперь есть имя.",
 "запрос": "То, о чём клиент просит на самом деле. Сформулированная просьба («дайте упражнение») и настоящий запрос совпадают не всегда.",
 "границы": "Договорённости о том, что входит в работу, а что нет. В том числе честное «это решает врач» вместо попытки помочь во всех областях сразу.",
 "самораскрытие": "Рассказ специалиста о себе. Иногда сближает, чаще перетягивает внимание на помогающего.",
 "эмпатическая настройка": "Подстройка темпа и интонации под состояние клиента: с закрытым человеком говорят тише и реже, чем с говорливым.",
 "ресурс": "Внутренние силы, на которые вы опираетесь в работе. Сегодня их запас зависит от того, как идут встречи и находится ли время на паузы."
},
supervisorName: "Вера Сергеевна",

/* вступление супервизора ко встречам 2 и 3: коротко о прошлой встрече, без подсказок к ответам (ТЗ v14) */
recap: {
 "title": "Перед встречей",
 "good": "В разговоре с {client} вы чаще спрашивали, чем объясняли, и это было слышно. Возьмите это с собой и в новую встречу.",

  "lecture": "С {client} вы не раз объясняли, как всё устроено. Клиенту сейчас важнее, чтобы его услышали.",

 },
 "tail": "Я на связи после каждого вашего ответа.",
 "reread": "Перечитать заметки"

   Лёгкая асимметрия заложена намеренно.
*/
function portraitSVG(look, opts = {}) {
  const l = look;
  const hair = {
    bob: `<path d="M24 46q0-28 26-28t26 28q0 10-4 16 2-22-22-22t-22 22q-4-6-4-16z" fill="${l.hair}"/>
          <path d="M21 45q1 17 6 25q-5 5-9 0q-4-13 3-25zM79 45q-1 17-6 25q5 5 9 0q4-13-3-25z" fill="${l.hair}"/>`,
    short: `<path d="M25 44q1-26 25-26t25 26q-3-8-9-11-8 4-16 3t-16-4q-6 3-9 12z" fill="${l.hair}"/>`,
    long: `<path d="M24 46q0-28 26-28t26 28q0 8-3 14 1-20-23-20t-23 20q-3-6-3-14z" fill="${l.hair}"/>
           <path d="M21 46q-6 27-1 48q6 5 11-1q-7-21-3-45zM79 46q6 27 1 48q-6 5-11-1q7-21 3-45z" fill="${l.hair}"/>`,
    bun: `<path d="M26 46q0-26 24-26t24 26q0 8-3 13 1-19-21-19t-21 19q-3-5-3-13z" fill="${l.hair}"/>
          <circle cx="50" cy="15" r="9" fill="${l.hair}"/>`
  }[l.hairStyle] || '';

  const face = (id, brows, eyes, mouth, shoulders) => `
    <g class="pst pst-${id}">
      <path d="${shoulders}" fill="${l.cloth}"/>
      <path d="M43 62h14v10H43z" fill="${l.skin}"/>
      <ellipse cx="50" cy="44" rx="22" ry="25" fill="${l.skin}"/>
      ${hair}
      <g stroke="#3a322c" stroke-width="2.2" stroke-linecap="round" fill="none">${brows}</g>
      <g stroke="#3a322c" stroke-width="2.4" stroke-linecap="round" fill="none">${eyes}</g>
      <g stroke="#3a322c" stroke-width="2.4" stroke-linecap="round" fill="none">${mouth}</g>
      <path d="M50 46v6" stroke="${l.accent}" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
    </g>`;

  // закрыт: брови сведены, плечи подняты, рот прямой с опущенным краем
  const closed = face('closed',
    `<path d="M38 36l10 3"/><path d="M62 35l-10 4"/>`,
    `<path d="M39 45q4 3 8 0"/><path d="M53 45q4 3 8 0"/>`,
    `<path d="M44 57q6 1 12-2"/>`,
    `M18 100q2-26 32-28 30 2 32 28z`);
  // нейтрален
  const neutral = face('neutral',
    `<path d="M38 34h10"/><path d="M62 33h-10"/>`,
    `<path d="M39 45q4 2 8 0"/><path d="M53 45q4 2 8 0"/>`,
    `<path d="M44 57h12"/>`,
    `M14 100q3-24 36-26 33 2 36 26z`);
  // приоткрылся: брови ровнее и выше, плечи опущены, рот чуть вверх
  const open = face('open',
    `<path d="M37 32l11 1"/><path d="M63 31l-11 2"/>`,
    `<path d="M39 44q4-3 8 0"/><path d="M53 44q4-3 8 0"/>`,
    `<path d="M43 56q7 4 14-1"/>`,
    `M10 100q4-22 40-24 37 2 40 24z`);

  const state = opts.state || 'closed';
  return `<svg class="portrait st-${state}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="rotate(-1.2 50 60)">${closed}${neutral}${open}</g></svg>`;
}

function tagStyle(P, r) {

/* ===== Кот v4: растровый рисунок на canvas; дышит только бок, голова и лапы неподвижны; моргает (проигрыватель из Макеты, cat-animation-v4.js) ===== */
const CAT_IMG = {};
function catImg(n) { if (!CAT_IMG[n]) { const im = new Image(); im.src = V12.pet[n]; CAT_IMG[n] = im; } return CAT_IMG[n]; }

    if (pose === 'sit') { const cut = 145, y0 = 145, y1 = 300; for (let y = y0; y < y1; y++) { const d = 1.8 * amount * Math.sin(Math.PI * (y - y0) / (y1 - y0)) ** 2; ctx.clearRect(0, y, cut, 1); ctx.drawImage(base, 0, y, cut, 1, -d, y, cut + d, 1); } }

/* v31: растровый портрет v7 в SVG-обёртке, чтобы работали прежние setFace и CSS-классы:

function personSVG(pid, cls) {

  const ks = Object.keys(P.patch).sort((a, b) => b.startsWith('x-') - a.startsWith('x-'));  // сначала эмоции
  for (const k of ks) { const pt = P.patch[k];
    h += `<image class="g-${k}" href="${pt.src}" x="${pt.r[0]}" y="${pt.r[1]}" width="${pt.r[2]}" height="${pt.r[3]}" preserveAspectRatio="none"/>`; }

  s = s.replace(/<g id="([a-z-]+)"( style="display:none")?>/g, (_, id) => `<g class="g-${id}">`);

/* Совместимость со старым кодом: portraitSVG(look) и videoFaceSVG(look) рисуют новые портреты */
function portraitSVG(look) {

/* ===== v24: неразрывный пробел после коротких слов, чтобы «и», «в», «не» не висели в конце строки ===== */
function nbspText(t) {
  let prev;
  do {
    prev = t;
    t = t.replace(/(^|[\s«( "])([а-яёА-ЯЁ]{1,2}|без|для|над|под|при|про|или|что|как|это)[ \t\n\r]+(?=\S)/g, '$1$2 ');
  } while (t !== prev);
  // внутри ключа термина [[...]] пробелы обычные: по ключу ищется словарь
  return t.replace(/\[\[[^\]|]+/g, m => m.replace(/ /g, ' '));

/* ===== v48: фоновая музыка. Трек 3 мин 12 с, в конце он сам затихает; следующий круг начинается на 183-й секунде
   с мягким нарастанием, поэтому шва не слышно. Включается первым нажатием «Войти в кабинет», кнопка в шапке выключает. ===== */
const MUSIC = { on: true, ctx: null, buf: null, master: null, el: null, next: 0, timer: 0, loading: false, VOL: 0.3, LOOP_AT: 183, FADE_IN: 2.5 };

  if (v <= 0) { if (MUSIC.on) { MUSIC.on = false; musicStop(); try { localStorage.setItem('dp-music', 'off'); } catch (e) {} } musicButton(); return; }
  MUSIC.VOL = v; try { localStorage.setItem('dp-music-vol', v); } catch (e) {}
  if (!MUSIC.on) { MUSIC.on = true; try { localStorage.setItem('dp-music', 'on'); } catch (e) {} musicStart(); }

  src.start(at); src.stop(at + buf.duration);

  if (MUSIC.ctx) { MUSIC.ctx.resume(); MUSIC.master.gain.setTargetAtTime(MUSIC.VOL, MUSIC.ctx.currentTime, 0.4); return; }

  MUSIC.master = ctx.createGain(); MUSIC.master.gain.value = MUSIC.VOL; MUSIC.master.connect(ctx.destination);

    .then(buf => { MUSIC.buf = buf; if (MUSIC.on) musicSchedule(ctx.currentTime); })
    .catch(() => {  // файл открыт с диска и браузер не дал прочитать трек: простой повтор через <audio>

    });
}

document.addEventListener('visibilitychange', () => {

/* ===== v45: без «пружины» у края прокрутки ===== */
document.addEventListener('wheel', e => {

  for (let el = e.target; el && el !== document.documentElement; el = el.parentElement) {

}

function resourceCaption() {

}

let sceneReady = false, sceneTime = '';
function renderCabinet() {
  show('cabinet');

  const time = TIME_OF(doneCount());
  // Сцену пересобираем, когда меняется время дня: другой свет, кот на новом месте
  if (!sceneReady || sceneTime !== time) {
    wrap.innerHTML = '<div class="scene-world" id="world"></div>';
    buildWorld($('#world'), time, { interactive: true });

  }

  $('#world').querySelectorAll('.world-hit').forEach(b => {
    const id = b.dataset.obj;

    if (id === 'cat') $('#world .cat-sprite').classList.toggle('glow', glow);
    // v24: на бирке видно, вернёт ли предмет силы сейчас
    b.classList.toggle('lit', glow && id !== 'computer');

  });

  renderObjRow();

  let text = '';

  if (!S.name || !S.brief) text = O.cabinetHint;
  else if (allDone() && !S.supervisionDone) text = CONTENT.ui.supervisionHint;
  else if (S.objectsUnlocked) {
    const any = Object.keys(CONTENT.restObjects).some(restAvailable);
    text = any ? (doneCount() >= 2 && O.restHint2 ? O.restHint2 : O.restHint) : S.resource >= 100 ? O.fullHint : O.restDoneHint;
  }
  catSay(text);

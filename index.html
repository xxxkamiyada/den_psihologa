/* Место кота по времени дня: стол → подоконник → диван → кресло (для фразы в окне «Погладить кота») */
const catSpot = () => Math.min(doneCount(), 3);

/* Сцена заполняет кабинет целиком; на телефоне она шире экрана и листается вбок,
   при входе в кабинет сдвигается к тому, о чём говорит кот: утром и в конце дня к компьютеру, в перерыв к коту */
function layoutScene() {
  const wrap = $('#sceneWrap'), w = $('#world'); if (!wrap || !w) return;
  const narrow = window.matchMedia('(max-width:760px)').matches;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  let sw, sh;
  if (narrow) { sh = H; sw = Math.round(H * 1.6); }
  else { const k = Math.max(W / 2560, H / 1600); sw = Math.round(2560 * k); sh = Math.round(1600 * k); }
  Object.assign(w.style, { width: sw + 'px', height: sh + 'px',
    left: narrow ? '0px' : Math.round((W - sw) / 2) + 'px', top: narrow ? '0px' : Math.round((H - sh) / 2) + 'px' });
  if (narrow) {
    const toPc = !S.name || !S.brief || allDone() || !S.objectsUnlocked;
    const c = CAT_AT[TIME_OF(doneCount())];
    const fx = toPc ? 53 : c.x + c.w / 2;
    wrap.scrollLeft = Math.max(0, fx / 100 * sw - W / 2);
  }
}

/* v44: подсказка кабинета — бумажная записка в углу сцены (кот спит и больше не говорит) */
function catSay(text) {
  catText = text;
  const hint = $('#cabHint');
  hint.innerHTML = text ? `<span class="cat-ico">${NOTE_ICON}</span><span>${esc(text)}</span>` : '';
  hint.style.display = text ? '' : 'none';
  hint.classList.remove('below', 'side'); hint.classList.add('note');
  hint.style.left = hint.style.top = '';
  if (!text) return;
  hint.style.animation = 'none'; void hint.offsetWidth; hint.style.animation = '';
  placeNote();
}
/* v45: записка висит на стене над монитором; если текст длинный — шире и ниже ростом, а если всё равно
   заходит на табличку компьютера, переезжает в левый верхний угол */
function placeNote() {
  const hint = $('#cabHint');
  if (!hint || hint.style.display === 'none' || window.matchMedia('(max-width:760px)').matches) return;
  const host = $('#cabinet'), tag = $('#world .world-hit[data-obj=computer] .paper-tag'), mon = $('#world .mon-screen');
  if (!host || !mon) return;
  const hr = host.getBoundingClientRect();
  const limit = Math.min(mon.getBoundingClientRect().top, tag ? tag.getBoundingClientRect().top : 1e9) - hr.top - 14;
  const maxW = Math.min(560, hr.width - 32);
  let w = 300;
  hint.style.left = ''; hint.style.width = w + 'px';
  while (hint.offsetTop + hint.offsetHeight > limit && w < maxW) { w += 40; hint.style.width = w + 'px'; }
  if (hint.offsetTop + hint.offsetHeight > limit) { hint.style.width = '340px'; hint.style.left = '16px'; }
  else hint.style.left = `calc(50% - ${w / 2}px)`;
}

    return openPane(`<div class="sheet"><h2>${esc(w.title)}</h2><p class="lead">${esc(w.text)}</p>
      <div class="sheet-actions"><button class="btn btn-main" data-go>${esc(w.go)}</button>
      <button class="btn btn-lite" data-back>${esc(w.back)}</button></div></div>`, {
      after: p => {
        p.querySelector('[data-go]').onclick = () => { S.warnShown = true; save(); startMeeting(idx); };
        p.querySelector('[data-back]').onclick = () => { S.warnShown = true; save(); closePane(); renderCabinet(); };
      }
    });
  }
  startMeeting(idx);
}

function startMeeting(idx) {
  closePane();
  const client = CLIENTS[idx];
  M = {

    hintUsed: false, pendingHint: false, locked: S.resource < 30, over: false
  };
  track('session_start', { meeting: idx + 1, client: client.id, resource: S.resource });

  screens.meeting.innerHTML = `
    <div class="meet-room" id="meetRoom"><div class="scene-world" id="meetWorld"></div></div>

    <div class="call-win ${M.locked ? 'm-dim' : ''}">
      <div class="call-body">

                <span class="contact-label">контакт</span>

              </div>
            </div>
          </div>

              </div>
              <button class="sup-all" id="supAll" hidden>Все заметки</button>
            </div>
            <div class="sup-note" id="supNote"></div>
            <div class="sup-open" aria-hidden="true">Читать полностью ›</div>
          </div>
        </div>
        <div class="call-right">
          <div class="feed" id="feedScroll"><div class="feed-in" id="feed"></div></div>
          <div class="answers" id="answers"><div class="answers-in" id="panel"></div></div>
        </div>
      </div>
    </div>
    <div class="pc-dock"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg><time>${['09:00', '12:40', '15:20', '18:30'][Math.min(doneCount(), 3)]}</time></div>
    </div></div>`;
  startFace();
  show('meeting');
  placeSup();
  buildWorld($('#meetWorld'), TIME_OF(doneCount()));
  fitWorld($('#meetRoom'), $('#meetWorld'));

  $('#feedScroll').addEventListener('click', () => { typingSkip = true; });
  M.notes = [];
  M.picks = [];
  $('#supAll').onclick = showAllNotes;
  $('#supBox').onclick = e => {
    if (!window.matchMedia('(max-width:900px)').matches) return;
    if (e.target.closest('.term')) return;
    showAllNotes();
  };
  // Встреча 1 — карточка-модель; встречи 2 и 3 — короткий взгляд на прошлую встречу
  if (idx === 0) setSupNote(withName(CONTENT.modelCard.text), { title: CONTENT.modelCard.title, keep: true });
  else setSupNote(recapText(idx), { title: CONTENT.recap.title, keep: true });
  runTurn();
}

/* Собираем вступление супервизора по выборам прошлой встречи:
   много удачных — отмечаем это; повторяющаяся ловушка — называем её; иначе — нейтральная фраза */
function recapText(idx) {
  const R = CONTENT.recap, prev = CLIENTS[idx - 1];
  const picks = (S.meetingPicks || {})[prev.id] || [];
  const good = picks.filter(p => p.level === 'good').length;
  const counts = {};
  picks.forEach(p => { if (p.level === 'bad' && p.trap) counts[p.trap] = (counts[p.trap] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  let line = R.mixed;
  if (good >= 3) line = R.good;
  else if (top && top[1] >= 2 && R.traps[top[0]]) line = R.traps[top[0]];
  else if ((S.meetingBand || {})[prev.id] === 'low' && R.low) line = R.low;  // v24: после провальной встречи честно
  return line.replace('{client}', prev.nameWith) + ' ' + R.tail;
}

function feed() { return $('#feed'); }
function scrollFeed() { const f = $('#feedScroll'); if (f) f.scrollTop = f.scrollHeight; }
function addToFeed(html) { const n = node(html); feed().appendChild(n); scrollFeed(); return n; }
function turnBlock() {
  const b = node('<div class="turn"></div>');
  feed().appendChild(b); scrollFeed(); return b;
}

function typeInto(el, text, speed) {
  return new Promise(res => {
    let i = 0; typingSkip = false;
    const step = () => {
      if (typingSkip || (M && M.fast)) { el.textContent = text; scrollFeed(); return res(); }
      el.textContent = text.slice(0, ++i); scrollFeed();
      if (i >= text.length) return res();
      setTimeout(step, speed);
    };
    step();
  });
}

async function clientSay(text, block) {
  const holder = block || M.block;
  const ind = node(`<div class="msg"><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div></div>`);
  holder.appendChild(ind); scrollFeed();
  setTalking(false);
  await pw(M.locked ? 900 : 620);
  ind.remove();
  const msg = node(`<div class="msg"><div class="bubble"><span></span></div></div>`);
  holder.appendChild(msg); scrollFeed();

  const mk = sayMarker(text);
  if (mk) {
    setTalking(mk.mouth, mk.label);
    if (mk.hold) await pw(mk.hold);
  }
  if (!mk || mk.hold) setTalking(true);
  await typeInto(msg.querySelector('.bubble span'), text, 28);
  setTalking(false);
  M.lastSaid = text;
  await pw(220);
}

async function selfSay(text, block) {
  const msg = node(`<div class="msg self"><div class="bubble"><span></span></div></div>`);
  block.appendChild(msg); scrollFeed();
  await typeInto(msg.querySelector('.bubble span'), text, 38);
  await pw(200);
}

function portraitState() {
  return M.contact <= 12 ? 'closed' : M.contact <= 30 ? 'neutral' : 'open';
}
/* Лицо клиента: настроение по контакту (закрыт — грустные брови, открыт — лёгкая улыбка),
   поверх него — разговор, ремарки из текста и моргание */
let faceTimer = null, blinkTimer = null;
const OWN_EMO = { marina: 'tense', artem: 'anxious', sonya: 'teary', vera: 'warm' };
let reactTimer = null;
function faceBase() {
  const st = portraitState();
  // пока контакт не сложился — свой кадр персонажа; реакция на ответ важнее
  const x = M.react || (st === 'closed' ? OWN_EMO[M.client.id] || 'none' : 'none');
  return st === 'closed' ? { b: 'sad', m: 'closed', x } : st === 'neutral' ? { b: 'calm', m: 'closed', x } : { b: 'calm', m: 'smile', x };
}
/* реакция лица на ответ: держится, пока клиент отвечает, и ещё немного после */
function react(x, ms) {
  clearTimeout(reactTimer); M.react = x;
  const svg = $('#videoFace svg'); if (svg) setFace(svg, { x });
  if (ms) reactTimer = setTimeout(() => { if (M) { M.react = null; refreshHead(); } }, ms);
}
function startFace() {
  clearInterval(faceTimer); clearTimeout(blinkTimer);
  const svg = $('#videoFace svg');
  setFace(svg, Object.assign({ e: 'open' }, faceBase()));
  // моргает раз в 3–6 секунд, не в такт
  const blink = () => {
    const f = $('#videoFace svg'); if (!f) return;
    if (!f.classList.contains('e-down')) {
      setFace(f, { e: 'closed' });
      setTimeout(() => { const g = $('#videoFace svg'); if (g && g.classList.contains('e-closed')) setFace(g, { e: 'open' }); }, 150);
    }
    blinkTimer = setTimeout(blink, 3000 + Math.random() * 3000);
  };
  blinkTimer = setTimeout(blink, 2200);
  const sup = $('.sup-ava svg'); if (sup) setFace(sup, { e: 'open', b: 'calm', m: 'smile', x: 'warm' });
}
function refreshHead() {
  const svg = $('#videoFace svg');
  if (svg && !M.talking) setFace(svg, faceBase());
  const f = $('#cFill'); if (f) f.style.width = (M.contact / 50 * 100) + '%';
}

/* маркеры в начале реплики задают видимую реакцию: молчит, смеётся, говорит тише */
const SAY_MARKERS = [
  [/долго молчит|молчит|пауза/i, { label: 'молчит', mouth: false, hold: 1100 }],
  [/смешок|усмеха|смеётся|смеется/i, { label: 'смеётся', mouth: true, hold: 900 }],
  [/тихо|медленно/i, { label: 'говорит тихо', mouth: true, hold: 0 }]
];
function sayMarker(text) {
  const m = text.match(/^\(([^)]+)\)/);
  if (!m) return null;
  for (const [re, v] of SAY_MARKERS) if (re.test(m[1])) return v;
  return null;
}

/* клиент говорит: рот двигается, под именем — состояние; ремарка в скобках меняет лицо */
function setTalking(on, label) {
  M.talking = on;
  const svg = $('#videoFace svg');
  clearInterval(faceTimer);
  if (svg) {
    const base = faceBase();
    if (label === 'молчит') setFace(svg, { e: 'down', b: base.b, m: 'closed' });
    else if (label === 'смеётся') setFace(svg, { e: 'open', b: 'up', m: 'smile', x: 'laugh' });
    else if (on) {
      const quiet = label === 'говорит тихо';
      // Соня говорит тихо — слёзы близко
      setFace(svg, { e: 'open', b: quiet ? 'sad' : base.b, x: quiet && M.client.id === 'sonya' && !M.react ? 'teary' : base.x });
      const seq = ['half', 'open', 'half', 'closed', 'open', 'half'];
      let k = 0;
      faceTimer = setInterval(() => { const f = $('#videoFace svg'); if (f) setFace(f, { m: seq[k++ % seq.length] }); }, 105);
    } else {
      setFace(svg, Object.assign({ e: 'open' }, base));
      // дослушав, клиент чуть кивает
      svg.classList.remove('nod'); void svg.getBoundingClientRect(); svg.classList.add('nod');
    }
  }
  const box = $('#videoBox');
  if (box) box.classList.toggle('speaking', on);
  const st = $('#vpState');
  if (st) st.textContent = label || (on ? 'говорит…' : 'слушает вас');
}

/* панель супервизора: одна живая заметка + история */
function setSupNote(html, opts = {}) {
  const box = $('#supNote'); if (!box) return;
  const shell = $('#supBox');
  if (shell) {
    shell.classList.remove('lvl-good', 'lvl-part', 'lvl-bad');
    if (opts.level) shell.classList.add('lvl-' + opts.level);
  }
  box.innerHTML = `${opts.title && opts.verdict ? `<div class="sn-title">${esc(opts.title)}</div>` : ''}
    ${opts.verdict ? `<div class="sn-verdict">${esc(opts.verdict)}</div>` : ''}
    <div class="sn-short">${opts.level ? `<i class="sn-dot ${opts.level}"></i>` : ''}${esc(opts.verdict || (/перед встречей/i.test(opts.title || '') ? 'Совет перед встречей' : opts.title || ''))}</div>
    <div class="sn-text">${opts.html ? html : esc(html)}</div>`;
  // Подсвечиваем новую заметку; вступительная (keep) появляется без вспышки
  box.classList.remove('flash');
  void box.offsetWidth;
  if (!opts.keep) box.classList.add('flash');
  // Записываем каждую заметку в журнал встречи — и вступительную тоже,
  // иначе на телефоне нажатие на панель в начале встречи открывало пустой список
  M.notes.push({ title: opts.title || '', verdict: opts.verdict || '', html: opts.html ? html : esc(html) });
  const all = $('#supAll'); if (all) all.hidden = M.notes.length < 2;
}

/* Список заметок супервизора — общий для встречи и для «перечитать» из расписания */
function notesHTML(notes) {
  return notes.map(n => `<div class="anchor"><div class="who">${esc(n.title)}</div>
    ${n.verdict ? `<div class="recall">${esc(n.verdict)}</div>` : ''}<div>${n.html}</div></div>`).join('');
}
function showAllNotes() {
  openPane(`<div class="sheet sheet-wide"><h2>Заметки супервизора</h2>
    <p class="lead">Всё, что ${esc(CONTENT.supervisorName)} сказала за эту встречу.</p>
    ${notesHTML(M.notes)}
    <div class="sheet-actions"><button class="btn btn-main" data-x>Вернуться к встрече</button></div></div>`, {
    after: p => p.querySelector('[data-x]').onclick = closePane
  });
}
/* Заметки прошлой встречи, открытые из расписания; «Назад» возвращает в компьютер */
function showPastNotes(i) {
  const c = CLIENTS[i];
  openPane(`<div class="sheet sheet-wide"><h2>Встреча с ${esc(c.nameWith)}</h2>
    <p class="lead">Заметки, которые ${esc(CONTENT.supervisorName)} оставила за эту встречу.</p>
    ${notesHTML((S.meetingNotes || {})[c.id] || [])}
    <div class="sheet-actions"><button class="btn btn-main" data-x>Вернуться к расписанию</button></div></div>`, {
    after: p => p.querySelector('[data-x]').onclick = () => { pcTab = 'schedule'; renderPC(); }
  });
}

function renderNote(text) {
  const seen = new Set();
  return esc(text).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, key, label) => {
    const vis = label || key;
    if (seen.has(key)) return vis;
    seen.add(key);
    return `<button class="term" data-term="${esc(key)}">${vis}</button>`;
  });
}

async function runTurn() {
  const t = M.client.turns[M.turn];
  M.block = turnBlock();
  showWaiting();
  // Ход 5 начинается по-разному: при контакте ниже 20 из 50 — сдержанный вариант (ТЗ v17)
  const msgs = (t.messagesLow && M.contact < 20) ? t.messagesLow : t.messages;
  for (const m of msgs) await clientSay(m, M.block);
  if (M.pendingHint) {
    setSupNote(esc(M.client.hint), { title: 'Подсказка', html: true, flash: true });
    M.pendingHint = false;
  }
  showReplyButton();
}

function showReplyButton() {
  $('#answers').classList.remove('hidden');
  const btn = $('#reply');
  if (!btn) {
    $('#panel').innerHTML = `<div class="reply-row"><button class="btn btn-main" id="reply">Ответить</button>
      <span class="reply-hint"></span></div>`;
  }
  M.fast = false;  // «Пропустить» действует до следующего выбора
  const sk = $('#skipBtn'); if (sk) sk.remove();
  const b = $('#reply');
  b.disabled = false;
  b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready');
  $('.reply-hint').textContent = `${M.client.name} ждёт вашего ответа`;
  b.onclick = showOptions;
}

function showOptions() {
  const t = M.client.turns[M.turn];
  const opts = shuffle(t.options);
  const lockGood = M.locked && M.turn === 0;
  $('#panel').innerHTML = `<div class="cue">Что вы скажете</div><div class="opts">${
    opts.map((o, i) => (lockGood && o.level === 'good')
      ? `<div class="opt locked">${esc(CONTENT.lockedOptionText)}</div>`
      : `<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join('')}</div>`;
  $('#panel').querySelectorAll('[data-i]').forEach(b =>
    b.onclick = () => pick(opts[+b.dataset.i]));
  scrollFeed();
}

/* пока клиент говорит — в панели ответов тихая строка, состояние видно в видеоокне */
function showWaiting() {
  $('#answers').classList.remove('hidden');
  $('#panel').innerHTML = `<div class="reply-row"><button class="btn btn-main" id="reply" disabled>Ответить</button>
    <span class="reply-hint"></span><button class="skip-btn" id="skipBtn" ${M.fast ? 'hidden' : ''}>Пропустить ›</button></div>`;
  $('#skipBtn').onclick = () => { M.fast = true; typingSkip = true; $('#skipBtn').hidden = true; };
}
// в режиме «Пропустить» паузы между репликами почти исчезают
const pw = ms => wait(M && M.fast ? Math.min(ms, 60) : ms);

async function pick(o) {
  showWaiting();
  const block = M.block;
  // Запоминаем уровень и тип ловушки — по ним строится вступление к следующей встрече
  M.picks.push({ level: o.level, trap: o.trap || '' });
  track('turn_choice', { client: M.client.id, turn: M.turn + 1, level: o.level, trap: o.trap || '' });

  await selfSay(o.text, block);

  const verdict = o.level === 'good' ? CONTENT.verdictGood : CONTENT.verdictOther;
  setSupNote(renderNote(o.note), { title: `Ответ № ${M.turn + 1}`, verdict, html: true, level: o.level });

  M.points += o.level === 'good' ? 2 : o.level === 'part' ? 1 : 0;
  M.contact = Math.max(0, Math.min(50, M.contact + (o.level === 'good' ? 10 : o.level === 'part' ? -5 : -10)));
  if (M.client.turns[M.turn].anchor) S.anchors[M.client.id] = o.level;
  // лицо клиента отзывается на ответ: попали — тронут(а), а на важном ходу удивление; частично — задумался; мимо — задело
  react(o.level === 'good' ? (M.client.turns[M.turn].anchor ? 'surprise' : 'touched') : o.level === 'part' ? 'think' : 'hurt');
  refreshHead();

  if (o.level === 'bad') M.badStreak++; else M.badStreak = 0;
  if (M.badStreak >= 2 && M.idx <= 2 && !M.hintUsed) { // подсказка во всех трёх встречах, один раз (ТЗ v19)
    M.hintUsed = true; M.pendingHint = true; M.badStreak = 0;
    track('hint_shown', { client: M.client.id, turn: M.turn + 1 });
  }

  // Реакция клиента — одно или два сообщения
  for (const r of [].concat(o.reaction)) await clientSay(r, block);
  react(M.react, 1800);  // после ответа клиента лицо ещё немного держит реакцию
  M.turn++;
  if (M.turn < M.client.turns.length) return runTurn();
  await endOfMeeting();
}

async function endOfMeeting() {
  const block = turnBlock();
  M.block = block;
  showWaiting();
  // Прощание тоже зависит от контакта: тёплое или сдержанное (ТЗ v17)
  const bye = (M.client.farewellLow && M.contact < 20) ? M.client.farewellLow : M.client.farewell;
  for (const f of bye) await clientSay(f, block);
  setTalking(false, 'прощается');
  /* «Завершить встречу» появляется в том же блоке, что и «Ответить», — без скачка (ТЗ v12) */
  $('#panel').innerHTML = `<div class="reply-row"><button class="btn btn-main ready" id="fin">Завершить встречу</button>
    <span class="reply-hint">Встреча подошла к концу</span></div>`;
  scrollFeed();
  $('#fin').onclick = () => meetingResult();
}

function meetingResult() {
  const pts = M.points;
  const band = pts >= 8 ? 'high' : pts >= 4 ? 'mid' : 'low';
  const cost = band === 'high' ? 10 : band === 'mid' ? 15 : 20;
  const r = CONTENT.meetingResult[band];

  S.done[M.client.id] = true;
  // Сохраняем заметки и выборы встречи: их можно перечитать перед следующим клиентом
  S.meetingNotes[M.client.id] = M.notes.slice();
  S.meetingPicks[M.client.id] = M.picks.slice();
  // После провальной встречи карточка честная: о чём встреча не случилась (решение 23)
  const card = band === 'low' && M.client.cardLow ? M.client.cardLow : M.client.card;
  S.meetingBand[M.client.id] = band;
  S.portfolio.push(card);
  S.objectsUnlocked = true;
  S.restThisBreak = 0;
  S.capIdx++;
  setResource(S.resource - cost);
  track('session_end', { client: M.client.id, points: pts, cost, resource: S.resource });
  save();

  const c = M.client;
  // v25: монитор встречи остаётся на месте, в нём вместо разговора открывается итог
  const pm = $('.pc-meet'); if (pm) pm.style.visibility = 'hidden';
  openPane(monitorHTML(`<div class="sheet sheet-wide"><div class="result-page">
    <div class="result-art">${videoFaceSVG(c.look)}<p>${esc(c.name)}, ${c.age}</p></div>
    <div class="result-copy"><h2>${esc(r.title)}</h2>
    <p class="lead">${esc((c.result && c.result[band]) || r.text)}</p>
    <div class="card-label">Новая карточка в портфолио</div>
    <div class="pcard hero"><h4>${esc(card.title)}</h4><div class="fact">${esc(card.fact)}</div>
      <div class="ins">${esc(card.insight)}</div></div>
    <p class="spend">${esc(CONTENT.spendText[band])}</p>
    <div class="sheet-actions"><button class="btn btn-main" data-x>Вернуться в кабинет</button></div></div></div></div>`, ['09:00', '12:40', '15:20', '18:30'][Math.min(doneCount() - 1, 3)]), {
    bare: true,
    after: p => {
      clearInterval(faceTimer); clearTimeout(blinkTimer);
      const f = p.querySelector('.result-art svg');
      setFace(f, { e: 'open', b: band === 'low' ? 'sad' : 'calm', m: band === 'high' ? 'smile' : 'closed', x: band === 'high' ? 'touched' : band === 'low' ? (OWN_EMO[M.client.id] || 'hurt') : 'think' });
      p.querySelector('[data-x]').onclick = () => { M = null; closePane(); renderCabinet(); };
    }
  });
}

/* ================= ИНТЕРАКТИВЫ ================= */
function finishRest(id, caption) {
  const obj = CONTENT.restObjects[id];
  // Силы возвращаются, только если объект сегодня ещё не помогал и в перерыве было меньше двух таких пауз
  const gain = restAvailable(id);
  const why = gain ? '' : S.resource >= 100 ? 'full' : S.usedObjects.includes(id) ? 'used' : 'limit';
  S.pauses++; S.capIdx++;
  S.restLog.push({ b: doneCount(), gain, o: id, d: id === 'coffee' ? lastDrink : '' });
  if (gain) {
    S.usedObjects.push(id); S.restThisBreak++;
    setResource(S.resource + obj.plus);
  }
  let extra = '';
  if (!S.restCardTaken) {
    S.restCardTaken = true; S.portfolio.push(CONTENT.restCard);
    extra = `<div class="pcard" style="margin-top:14px"><h4>${esc(CONTENT.restCard.title)}</h4>
      <div class="fact">${esc(CONTENT.restCard.fact)}</div><div class="ins">${esc(CONTENT.restCard.insight)}</div></div>`;
  }
  track('rest_used', { object: id, breakNo: doneCount(), gain });
  save();
  openPane(`<div class="sheet"><h2>${esc(obj.name)}</h2>
    ${caption ? `<div class="caption-box">${esc(caption)}</div>` : ''}
    <p class="spend">${esc(gain ? (obj.plus >= 15 ? CONTENT.gainText.big : CONTENT.gainText.small) : CONTENT.gainText[why])}</p>
    ${extra}
    <div class="sheet-actions"><button class="btn btn-main" data-x>Вернуться в кабинет</button></div></div>`, {
    after: p => p.querySelector('[data-x]').onclick = () => { closePane(); renderCabinet(); }
  });
}

      <div><div class="field-label">${esc(CONTENT.ui.drinkAdd)}</div>
        <div class="pick-grid">${d.addons.map(a => `<button class="chip" data-a="${a.id}">${esc(a.label)}</button>`).join('')}</div></div>
    </div>
    <div class="sheet-actions"><button class="btn btn-main" data-ok disabled>Готово</button>
      <button class="btn btn-lite" data-x>Не сейчас</button></div></div></div></div>`, {
    after: p => {
      const ok = p.querySelector('[data-ok]');
      // Картинка напитка: посуда по основе, добавки поверх, у воды без пара
      const ART_BASE = { water: 'water', espresso: 'espresso', cappuccino: 'cappuccino', blacktea: 'black-tea', greentea: 'green-tea', cocoa: 'cocoa' };
      const drawDrink = () => {
        const b = ART_BASE[base] || 'black-tea';
        // v27: посуда из Макеты v3, пар v4 над поверхностью напитка; добавки только в подписи, на картинке их нет
        const ST = { espresso: [155, 150], cappuccino: [151, 134], 'black-tea': [154, 124], 'green-tea': [157, 141], cocoa: [152, 141] }[b];
        p.querySelector('#drinkArt').innerHTML = `<img src="${ART.drink3[b]}" alt="">` +
          (ST ? `<img class="steam-v4" src="${ART.drink3.steam}" alt="" style="left:${(ST[0] - 15) / 3.2}%;top:${(ST[1] - 90) / 2.9}%">` : '');
      };
      drawDrink();
      p.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
        base = b.dataset.b;
        p.querySelectorAll('[data-b]').forEach(o => o.classList.toggle('on', o === b));
        ok.disabled = false;
        drawDrink();
      });
      p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        const id = b.dataset.a;
        add.has(id) ? add.delete(id) : add.add(id);
        b.classList.toggle('on', add.has(id));
        drawDrink();
      });
      p.querySelector('[data-x]').onclick = closePane;

        const bp = d.bases.find(x => x.id === base).phrase;
        const list = d.addons.filter(a => add.has(a.id)).map(a => a.phrase);
        const joined = list.length === 1 ? list[0]
          : list.slice(0, -1).join(', ') + ' и ' + list[list.length - 1];
        const head = list.length ? `${bp} с ${joined}.` : `${bp}, без добавок.`;
        const tail = base === 'water' ? d.tailWater : list.length ? d.tailAdded : d.tailPlain;
        lastDrink = base;
        finishRest('coffee', `${head} ${tail}`);
      };
    }
  });
}

function interPlant() {
  const obj = CONTENT.restObjects.plant;
  openPane(`<div class="sheet"><h2>Полить растение</h2>
    <p class="lead">${esc(CONTENT.ui.plantLead)}</p>
    <div class="water-scene">
      <div class="water-art">
        <img src="${ART.water3.pot}" alt="">
        <img id="soil" class="pot-wet" src="${ART.water3['pot-wet']}" alt="">
        <img id="canGroup" class="can pourable" src="${ART.water3.can}" alt="Лейка" role="button" tabindex="0" aria-label="Наклонить лейку и полить">
        <img id="streamGroup" class="stream" src="${ART.water3.water}" alt="">
      </div>
    </div>
    <div class="water-bar"><i id="wfill"></i></div>
    <div class="water-note" id="wnote">Земля сухая. Нажмите на лейку и держите.</div>
    <div class="sheet-actions">
      <button class="btn btn-main" data-ok disabled>Готово</button>
      <button class="btn btn-lite" data-x>Не сейчас</button>
    </div></div>`, {
    after: p => {
      const ok = p.querySelector('[data-ok]'),
            fill = p.querySelector('#wfill'), note = p.querySelector('#wnote'),
            can = p.querySelector('#canGroup'), soil = p.querySelector('#soil'),
            stream = p.querySelector('#streamGroup');
      const btn = can;
      const NEED = 2200;
      let got = 0, last = 0, raf = null, done = false, tapped = false;

      const paint = () => {
        const k = Math.min(1, got / NEED);
        fill.style.width = (k * 100) + '%';
        soil.style.opacity = k;  // v27: земля темнеет постепенно — влажное растение проявляется поверх сухого
        if (k >= 1 && !done) {
          done = true; stop();
          note.textContent = 'Земля потемнела и осела. Достаточно.';
          ok.disabled = false; can.classList.add('done');
        }
      };
      const tick = now => {
        if (!raf) return;
        got += now - last; last = now; paint();
        if (!done) raf = requestAnimationFrame(tick);
      };
      const start = e => {
        if (done || raf) return;
        e.preventDefault(); tapped = true;
        can.classList.add('pouring'); stream.classList.add('on');
        note.textContent = 'Льётся…';
        last = performance.now(); raf = requestAnimationFrame(tick);
      };
      function stop() {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        can.classList.remove('pouring'); stream.classList.remove('on');
        if (!done) note.textContent = tapped && got < 400
          ? CONTENT.ui.plantShort
          : 'Ещё немного.';
      }
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') start(e); });
      btn.addEventListener('keyup', stop);
      window.addEventListener('pointerup', stop);
      window.addEventListener('pointercancel', stop);
      p.querySelector('[data-x]').onclick = () => { stop(); closePane(); };
      ok.onclick = () => { stop(); finishRest('plant', obj.caption); };
    }
  });
}

function runBreath() {
  openPane(`<div class="sheet"><h2>Дыхание по счёту</h2>
    <p class="lead">${esc(CONTENT.breathing.howto)}</p>
    <div class="breath">
      <div class="breath-ring"><div class="breath-circle" id="bc"><span class="bw" id="bw">приготовьтесь</span><span class="bn" id="bn"></span></div></div>
      <div class="breath-meta" id="bm">цикл 1 из 3</div>
    </div>
    <div class="sheet-actions"><button class="btn btn-main" data-enough>Достаточно</button></div></div>`, {
    after: p => {
      const bc = p.querySelector('#bc'), bw = p.querySelector('#bw'), bn = p.querySelector('#bn'),
            bm = p.querySelector('#bm'), btn = p.querySelector('[data-enough]');
      let cycle = 0, stopped = false;
      // Заканчиваем практику только по нажатию: «Достаточно» во время дыхания или «Готово» после трёх циклов
      const done = () => { if (!stopped) { stopped = true; finishRest('sofa', CONTENT.breathing.caption); } };
      btn.onclick = done;
      // вдох 4 секунды (круг растёт 4 секунды), задержка 4, выдох 6 (круг сжимается 6 секунд); цифры считают вниз
      const PH = [['вдох', 4, 1], ['задержите', 4, null], ['выдох', 6, 0.62]];
      const run = async () => {
        await wait(1500); if (stopped) return;
        while (cycle < 3 && !stopped) {
          bm.textContent = `цикл ${cycle + 1} из 3`;
          for (const [word, n, sc] of PH) {
            bw.textContent = word;
            if (sc) { bc.style.transitionDuration = n + 's'; bc.style.transform = `scale(${sc})`; }
            for (let k = n; k > 0; k--) { bn.textContent = k; await wait(1000); if (stopped) return; }
          }
          cycle++;
        }
        // Три цикла пройдены: экран не закрывается сам, кнопка становится «Готово»
        if (!stopped) { bw.textContent = 'готово'; bn.textContent = ''; bc.style.transitionDuration = '1s'; bc.style.transform = 'scale(.8)';
          bm.textContent = 'три цикла позади'; btn.textContent = 'Готово'; }
      };
      run();
    }
  });
}

/* Строка про паузы говорит, что игрок успел между встречами: «погладить кота и выпить чаю» */
function pauseLine() {
  const f = CONTENT.finale, log = S.restLog || [];
  if (!log.length) return f.pauses.none;
  const verbs = [];
  for (const r of log) {
    const v = f.pauseVerbs[r.o === 'coffee' && r.d ? r.d : r.o];
    if (v && !verbs.includes(v)) verbs.push(v);
  }
  if (!verbs.length) return f.pauseTailSome;
  const list = verbs.length === 1 ? verbs[0] : verbs.slice(0, -1).join(', ') + ' и ' + verbs[verbs.length - 1];
  const breaks = new Set(log.map(r => r.b)).size;
  return f.pauseDid.replace('{list}', list) + ' ' + (breaks >= 3 ? f.pauseTailAll : f.pauseTailSome);
}

/* Комната на заставке заполняет экран; на телефоне — полосой сверху, видна правая часть со столом */
function layoutSplash() {
  const box = $('#splashWorld'), w = $('#splashScene'); if (!box || !w) return;
  const W = box.clientWidth, H = box.clientHeight, k = Math.max(W / 2560, H / 1600);
  const sw = 2560 * k, sh = 1600 * k, narrow = window.matchMedia('(max-width:760px)').matches;
  Object.assign(w.style, { width: sw + 'px', height: sh + 'px', left: (W - sw) / 2 + 'px', top: (H - sh) / 2 + 'px' });
}
window.addEventListener('resize', () => { if (screens.splash && screens.splash.classList.contains('on')) layoutSplash(); });
window.addEventListener('resize', () => { const r = $('#meetRoom'); if (r && screens.meeting.classList.contains('on')) fitWorld(r, $('#meetWorld')); });

  if (!t) { pop.classList.remove('on'); return; }
  const key = t.dataset.term;
  pop.innerHTML = `<b>${esc(key)}</b>${esc(CONTENT.glossary[key] || '')}`;
  pop.classList.add('on');
  const r = t.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  pop.style.width = w + 'px';
  pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)) + 'px';
  pop.style.top = (r.bottom + 8 + pop.offsetHeight > window.innerHeight
    ? Math.max(12, r.top - pop.offsetHeight - 8) : r.bottom + 8) + 'px';
});

/* ================= СТАРТ ================= */
function hideCookies() {
  S.cookiesOk = true; save();
  document.body.classList.remove('ck-on');
  const ck = $('#cookies'); if (ck) ck.classList.add('off');
}

function boot() {
  screens.splash = $('#splash');
  screens.cabinet = $('#cabinet');
  screens.meeting = $('#meeting');
  const saved = loadSave();
  if (saved) S = Object.assign(DEF(), saved);
  // портреты: у каждого клиента свой рисунок, у супервизора — Вера
  CLIENTS.forEach(c => { c.look.pid = c.id; });
  SUPERVISOR_LOOK.pid = 'vera';
  renderResource();
  show('splash');
  renderSplash();

  const ck = $('#cookies');
  if (!S.cookiesOk) {
    ck.classList.remove('off');
    document.body.classList.add('ck-on');  // на телефоне карточка заставки поднимается над плашкой
    $('#ckText').textContent = CONTENT.ui.cookies;  // текст плашки берём из контента
    ck.querySelector('[data-ck]').onclick = hideCookies;
  }
  window.__den = { state: () => S, events: () => window.__denEvents || [], meeting: () => M };
}
document.addEventListener('DOMContentLoaded', boot);
})();

</script>
